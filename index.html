<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>给宝宝的睡前故事</title>
  <meta name="theme-color" content="#0b1020" />
  <style>
    :root{
      --bg:#070a14;
      --panel:rgba(20,26,50,.55);
      --panel2:rgba(20,26,50,.42);
      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --muted2:rgba(255,255,255,.45);
      --accent:#7c86ff;
      --accent2:#b28cff;
      --btn:rgba(124,134,255,.18);
      --shadow: 0 24px 70px rgba(0,0,0,.55);
      --radius: 22px;
      --radius2: 16px;
      --maxw: 980px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background: radial-gradient(1200px 700px at 30% 15%, rgba(125,140,255,.20), transparent 60%),
                  radial-gradient(900px 600px at 85% 20%, rgba(178,140,255,.14), transparent 60%),
                  radial-gradient(1000px 800px at 50% 110%, rgba(0,0,0,.80), transparent 55%),
                  var(--bg);
      overflow-x:hidden;
    }

    /* Canvas sits behind everything */
    #night-canvas{position:fixed; inset:0; z-index:0; pointer-events:none;}

    .wrap{
      position:relative;
      z-index:1;
      width:min(var(--maxw), calc(100% - 32px));
      margin: 34px auto 60px;
    }

    .hero{
      display:flex;
      gap:18px;
      align-items:center;
      padding: 18px 18px 14px;
      border-radius: calc(var(--radius) + 6px);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .moon{
      width:64px;height:64px;border-radius:18px;
      display:grid;place-items:center;
      background: linear-gradient(180deg, rgba(124,134,255,.22), rgba(124,134,255,.08));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      flex:0 0 auto;
      font-size:30px;
    }
    .title h1{
      margin:0;
      font-size:42px;
      letter-spacing:.5px;
      line-height:1.05;
    }
    .title p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:18px;
    }
    .chip{
      margin-left:auto;
      padding: 10px 14px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(20,26,50,.35);
      color:var(--muted);
      font-size:14px;
      max-width: 320px;
      text-overflow: ellipsis;
      overflow:hidden;
      white-space:nowrap;
    }

    .status{
      margin: 18px 0 0;
      padding: 14px 16px;
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      color: var(--muted);
      backdrop-filter: blur(10px);
      display:none;
    }
    .status.show{display:block}
    .status b{color:var(--text)}

    .toolbar{
      margin: 18px 0 16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color:var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.06)}
    .btn.primary{background: rgba(124,134,255,.20); border-color: rgba(124,134,255,.35)}
    .btn.ghost{background: transparent}
    .btn small{color:var(--muted); margin-left:6px}

    .list{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top: 10px;
    }

    .card{
      padding: 16px 16px 14px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 55px rgba(0,0,0,.40);
      backdrop-filter: blur(12px);
    }

    .cardHeader{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }
    .tagIcon{
      width:34px;height:34px;border-radius:12px;
      display:grid;place-items:center;
      background: rgba(124,134,255,.15);
      border:1px solid rgba(124,134,255,.25);
      flex:0 0 auto;
      font-size:18px;
      margin-top:2px;
    }
    .meta{
      flex:1 1 auto;
      min-width: 0;
    }
    .meta h3{
      margin:0;
      font-size:22px;
      line-height:1.1;
    }
    .meta .sub{
      margin-top:8px;
      color: var(--muted);
      font-size:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      color: var(--muted);
      font-size: 12px;
    }
    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex:0 0 auto;
    }

    audio{
      width:100%;
      margin-top: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
    }

    @media (max-width: 720px){
      .title h1{font-size: 34px;}
      .chip{display:none}
      .meta h3{font-size: 19px;}
    }
  </style>
</head>

<body>
  <canvas id="night-canvas" aria-hidden="true"></canvas>

  <div class="wrap">
    <div class="hero">
      <div class="moon">🌙</div>
      <div class="title">
        <h1>给宝宝的睡前故事</h1>
        <p id="subtitle">我不在你身边，但我在你耳边。</p>
      </div>
      <div class="chip" id="quoteChip">今晚小句：今天也很棒。</div>
    </div>

    <div class="status" id="statusBox"></div>

    <div class="toolbar">
      <button class="btn primary" id="btnTonight">只看今晚</button>
      <button class="btn" id="btnAll">查看往期</button>
      <!-- 烟花按钮已移除：改为 左键金色 / 右键粉紫 -->
    </div>

    <div class="list" id="list"></div>

    <!-- 底部提示小字整段移除 -->
  </div>

<script>
(() => {
  const STATUS = document.getElementById('statusBox');
  const LIST = document.getElementById('list');

  const QUOTES = [
    "把烦恼交给夜色。",
    "闭上眼，我在。",
    "今天也很棒。",
    "来，把今天交给我。",
    "呼吸慢一点，世界就慢下来。",
    "你很努力了，真的。"
  ];

  function showStatus(html, isError=false){
    STATUS.classList.add('show');
    STATUS.innerHTML = (isError ? "<b>加载失败：</b> " : "") + html;
  }
  function hideStatus(){
    STATUS.classList.remove('show');
    STATUS.innerHTML = "";
  }

  // Random quote
  const quote = QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('quoteChip').textContent = "今晚小句：" + quote;

  // Local storage for "heard"
  const HEARD_KEY = "goodnight_heard_v1";
  const heard = new Set(JSON.parse(localStorage.getItem(HEARD_KEY) || "[]"));

  function markHeard(id, val){
    if (val) heard.add(id);
    else heard.delete(id);
    localStorage.setItem(HEARD_KEY, JSON.stringify([...heard]));
  }

  function fmtDate(d){
    // expecting YYYY-MM-DD
    return d;
  }

  function safeText(s){
    return (s ?? "").toString();
  }

  function render(items, mode="tonight"){
    LIST.innerHTML = "";

    // sort by date desc then id desc
    items.sort((a,b) => {
      const da = (a.date || a.id || "").toString();
      const db = (b.date || b.id || "").toString();
      if (db !== da) return db.localeCompare(da);
      return (b.id || "").toString().localeCompare((a.id || "").toString());
    });

    const todayStr = new Date().toISOString().slice(0,10);

    let filtered = items;
    if (mode === "tonight") {
      // Choose the max date as "tonight" (safer than relying on user's timezone)
      const maxDate = items.length ? (items[0].date || items[0].id) : todayStr;
      filtered = items.filter(x => (x.date || x.id) === maxDate);
    }

    if (!filtered.length){
      showStatus("没有找到故事条目。请检查 stories.json。", true);
      return;
    } else {
      hideStatus();
    }

    for (const it of filtered){
      const id = safeText(it.id || it.date || it.title || Math.random().toString(16).slice(2));
      const date = safeText(it.date || it.id || "");
      const title = safeText(it.title || "未命名故事");
      const note = safeText(it.note || "");
      const file = safeText(it.file || "");

      const isHeard = heard.has(id);

      const card = document.createElement('div');
      card.className = "card";
      card.innerHTML = `
        <div class="cardHeader">
          <div class="tagIcon">🌙</div>
          <div class="meta">
            <h3>${mode==="tonight" ? "今晚故事 · " : "往期故事 · "}${escapeHtml(title)}</h3>
            <div class="sub">
              <span class="pill">🗓 ${escapeHtml(fmtDate(date))}</span>
              <span class="pill">${isHeard ? "已听" : "未听"}</span>
              ${note ? `<span class="pill">${escapeHtml(note)}</span>` : ""}
            </div>
          </div>
          <div class="actions">
            <button class="btn ghost btnMark">${isHeard ? "标记未听" : "标记已听"}</button>
          </div>
        </div>
        <audio controls preload="metadata">
          <source src="${encodeURI(file)}" type="audio/mpeg">
          你的浏览器不支持音频播放。
        </audio>
      `;

      // Mark heard toggle
      card.querySelector('.btnMark').addEventListener('click', () => {
        const now = !heard.has(id);
        markHeard(id, now);
        render(items, mode);
      });

      // Auto mark heard when ended
      const audio = card.querySelector('audio');
      audio.addEventListener('ended', () => {
        markHeard(id, true);
        render(items, mode);
      });

      // If audio fails to load, show helpful hint
      audio.addEventListener('error', () => {
        showStatus(`音频加载失败：<code>${escapeHtml(file)}</code>。<br/>请确认：文件已上传到仓库根目录，且文件名与 stories.json 完全一致（大小写/空格也算）。`, true);
      });

      LIST.appendChild(card);
    }
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  // Load JSON with cache-bust
  async function loadStories(){
    try{
      const res = await fetch("stories.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("stories.json 读取失败：" + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("stories.json 格式不对：需要是数组 []");
      return data;
    } catch (e){
      showStatus(`${escapeHtml(e.message)}<br/>你可以在地址栏打开 <code>/stories.json</code> 看是否能访问。`, true);
      return [];
    }
  }

  // UI buttons
  let allItems = [];
  let mode = "tonight";

  document.getElementById('btnTonight').addEventListener('click', () => {
    mode = "tonight";
    render(allItems, mode);
  });
  document.getElementById('btnAll').addEventListener('click', () => {
    mode = "all";
    render(allItems, mode);
  });

  // ---------- 星空 + 双风格烟花 ----------
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById('night-canvas');
  const ctx = canvas.getContext('2d', { alpha: true });

  let W = 0, H = 0, DPR = 1;

  function resizeCanvas() {
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas, { passive: true });
  resizeCanvas();

  const stars = [];
  const STAR_COUNT = prefersReduced ? 60 : 160;
  function rand(min,max){ return Math.random()*(max-min)+min; }

  function initStars(){
    stars.length = 0;
    for(let i=0;i<STAR_COUNT;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: rand(0.6,1.6),
        a: rand(0.25,0.9),
        tw: rand(0.004,0.014)*(Math.random()<0.5?1:-1),
        drift: rand(-0.015,0.015)
      });
    }
  }
  initStars();

  const particles = [];
  function spawnExplosion(x,y, style="fantasy"){
    const count = style==="gold" ? Math.floor(rand(60,85)) : Math.floor(rand(45,70));
    for(let i=0;i<count;i++){
      const angle = (Math.PI*2)*(i/count) + rand(-0.06,0.06);
      const speed = style==="gold" ? rand(1.6,4.4) : rand(1.2,3.8);

      // color palettes
      let hue, sat, light;
      if(style==="fantasy"){
        // dreamy pink-purple: 285~330 with occasional 260
        hue = (Math.random()<0.15) ? rand(255,270) : rand(285,330);
        sat = 92;
        light = 74;
      } else {
        // real gold: 38~62 with slight orange flicker
        hue = rand(38,62);
        sat = 96;
        light = rand(58,66);
      }

      particles.push({
        x,y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        g: style==="gold" ? 0.055 : 0.04,
        drag: style==="gold" ? 0.982 : 0.985,
        a: 1,
        fade: style==="gold" ? rand(0.010,0.020) : rand(0.008,0.018),
        r: style==="gold" ? rand(1.4,2.3) : rand(1.2,2.1),
        hue, sat, light,
        sparkle: style==="gold" ? rand(0.12,0.30) : rand(0.06,0.18),
        style
      });
    }
  }

  // gentle auto fantasy fireworks
  let lastAuto = performance.now();
  const AUTO_MS = prefersReduced ? 999999 : 9000;
  function maybeAutoFirework(){
    const now = performance.now();
    if(now - lastAuto > AUTO_MS){
      lastAuto = now;
      if(Math.random() < 0.85){
        spawnExplosion(rand(W*0.2,W*0.8), rand(H*0.12,H*0.42), "fantasy");
      }
    }
  }

  // 右键菜单禁用（避免右键放烟花时弹出菜单）
  window.addEventListener('contextmenu', (e) => {
    e.preventDefault();
  }, { passive: false });

  // 左键金色 / 右键粉紫（仅在上半屏“天空区域”触发，避免点到播放器）
  window.addEventListener('mousedown', (e) => {
    if(prefersReduced) return;

    const skyOnly = (e.clientY < H * 0.7);
    if(!skyOnly) return;

    // 0 = 左键, 2 = 右键
    if(e.button === 0){
      spawnExplosion(e.clientX, e.clientY, "gold");
    } else if(e.button === 2){
      e.preventDefault();
      spawnExplosion(e.clientX, e.clientY, "fantasy");
    }
  }, { passive: false });

  function drawVignette(){
    const g = ctx.createRadialGradient(W*0.5, H*0.35, 0, W*0.5, H*0.5, Math.max(W,H));
    g.addColorStop(0, 'rgba(10, 18, 40, 0.18)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0.58)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  function tick(){
    ctx.clearRect(0,0,W,H);

    // stars
    for(const s of stars){
      s.a += s.tw;
      if(s.a < 0.15 || s.a > 0.95) s.tw *= -1;
      s.x += s.drift;
      if(s.x < -10) s.x = W+10;
      if(s.x > W+10) s.x = -10;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }

    maybeAutoFirework();

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.a -= p.fade;

      if(p.a <= 0){
        particles.splice(i,1);
        continue;
      }

      // sparkle flicker (gold stronger)
      const flicker = (Math.random() < p.sparkle) ? rand(-0.18,0.10) : 0;
      const alpha = Math.max(0, Math.min(1, p.a + flicker));

      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`;
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }

    drawVignette();
    requestAnimationFrame(tick);
  }
  tick();

  // Load stories
  (async () => {
    allItems = await loadStories();
    render(allItems, "tonight");
  })();

})();
</script>

</body>
</html>
