<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>给宝宝的睡前故事</title>

  <!-- 降低被搜索引擎收录概率（不是绝对防护） -->
  <meta name="robots" content="noindex, nofollow" />

  <style>
    :root{
      --bg1:#070A14;
      --bg2:#0B1230;
      --card:rgba(255,255,255,.06);
      --stroke:rgba(255,255,255,.12);
      --text:#EAF0FF;
      --muted:rgba(234,240,255,.72);
      --accent:#7C83FF;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --radius: 22px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei";
      color:var(--text);
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(124,131,255,.18), transparent 55%),
        radial-gradient(900px 700px at 80% 30%, rgba(154,216,255,.14), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      min-height:100vh;
    }
    body::before{
      content:"";
      position:fixed; inset:0;
      background-image:
        radial-gradient(2px 2px at 15% 22%, rgba(255,255,255,.32) 30%, transparent 32%),
        radial-gradient(1.5px 1.5px at 62% 18%, rgba(255,255,255,.25) 30%, transparent 32%),
        radial-gradient(1.5px 1.5px at 78% 62%, rgba(255,255,255,.18) 30%, transparent 32%),
        radial-gradient(1px 1px at 28% 70%, rgba(255,255,255,.20) 30%, transparent 32%),
        radial-gradient(1px 1px at 90% 38%, rgba(255,255,255,.16) 30%, transparent 32%);
      opacity:.9;
      pointer-events:none;
    }

    .wrap{ max-width: 860px; margin:0 auto; padding: 30px 18px 60px; }

    .top{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:14px;
      margin-bottom: 18px;
    }

    .title{
      display:flex; gap:12px; align-items:center;
    }
    .moon{
      width:46px; height:46px;
      border-radius:14px;
      background: linear-gradient(135deg, rgba(124,131,255,.35), rgba(154,216,255,.18));
      border:1px solid var(--stroke);
      display:grid; place-items:center;
      box-shadow: var(--shadow);
      font-size:22px;
      user-select:none;
    }
    h1{ margin:0; font-size: 28px; letter-spacing:.5px; }
    .sub{ margin:6px 0 0; color:var(--muted); line-height:1.6; }

    .pill{
      align-self:center;
      display:flex; gap:8px; align-items:center;
      padding:10px 12px;
      border-radius: 999px;
      border:1px solid var(--stroke);
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      color: var(--muted);
      font-size: 13px;
      user-select:none;
      max-width: 44ch;
    }
    .pill b{ color:var(--text); font-weight:650; }

    .grid{
      display:flex;
      flex-direction:column;
      gap: 14px;
      margin-top: 18px;
    }

    .card{
      background: linear-gradient(180deg, var(--card), rgba(255,255,255,.04));
      border:1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 16px 16px 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;
    }
    .card::after{
      content:"";
      position:absolute; inset:-2px;
      background: radial-gradient(600px 200px at 10% 10%, rgba(124,131,255,.16), transparent 55%);
      pointer-events:none;
    }

    .row{
      position:relative;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
      z-index:1;
    }

    .left .name{
      font-size: 20px;
      font-weight: 760;
      margin: 0 0 4px;
    }
    .left .note{
      margin:0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      border:0;
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
      font-weight: 760;
      letter-spacing:.2px;
      background: var(--accent);
      color: #0B1020;
      box-shadow: 0 10px 30px rgba(124,131,255,.25);
      user-select:none;
    }
    .btn.secondary{
      background: transparent;
      color: var(--text);
      border:1px solid rgba(255,255,255,.18);
      box-shadow: none;
    }
    .btn:active{ transform: translateY(1px); }

    .badge{
      font-size:12px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      color: var(--muted);
      background: rgba(255,255,255,.04);
      user-select:none;
      white-space:nowrap;
    }
    .badge.done{
      color: rgba(154,216,255,.95);
      border-color: rgba(154,216,255,.35);
      background: rgba(154,216,255,.08);
    }

    audio{
      position:relative;
      z-index:1;
      width:100%;
      margin-top: 12px;
      border-radius: 16px;
      filter: saturate(1.05);
    }

    .divider{
      color: rgba(234,240,255,.55);
      font-size: 12px;
      margin: 10px 0 0;
      user-select:none;
    }

    .footer{
      margin-top: 18px;
      color: rgba(234,240,255,.60);
      font-size: 12px;
      line-height: 1.7;
    }

    /* 解锁页 */
    .lock{
      position:fixed; inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 18px;
      z-index: 9999;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(124,131,255,.22), transparent 55%),
        radial-gradient(900px 700px at 80% 30%, rgba(154,216,255,.18), transparent 55%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
    }
    .lockcard{
      width:min(520px, 100%);
      background: rgba(255,255,255,.06);
      border:1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      padding: 18px 18px 16px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;
    }
    .lockcard::after{
      content:"";
      position:absolute; inset:-2px;
      background: radial-gradient(650px 220px at 10% 10%, rgba(124,131,255,.18), transparent 55%);
      pointer-events:none;
    }
    .locktitle{
      position:relative;
      display:flex; gap:10px; align-items:center;
      font-weight: 820;
      font-size: 18px;
      z-index:1;
      user-select:none;
    }
    .locksub{
      position:relative;
      margin: 8px 0 14px;
      color: rgba(234,240,255,.75);
      line-height:1.65;
      font-size: 13px;
      z-index:1;
    }
    .lockrow{
      position:relative;
      display:flex;
      gap:10px;
      z-index:1;
    }
    .inp{
      flex:1;
      padding: 12px 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.18);
      color: var(--text);
      outline:none;
      font-size: 14px;
    }
    .err{
      position:relative;
      margin-top: 10px;
      color: rgba(255,160,180,.95);
      font-size: 12px;
      display:none;
      z-index:1;
      user-select:none;
    }

    @media (max-width:520px){
      h1{ font-size: 22px; }
      .moon{ width:42px; height:42px; }
      .left .name{ font-size:18px; }
      .locktitle{ font-size: 16px; }
    }
  </style>
</head>

<body>
  <!-- 解锁层 -->
  <div class="lock" id="lockLayer" aria-hidden="false">
    <div class="lockcard">
      <div class="locktitle"><span class="moon" style="width:40px;height:40px;border-radius:14px;">🔒</span> 解锁今晚的声音</div>
      <div class="locksub">输入暗号后进入。<br>（这是我们的小秘密。）</div>
      <div class="lockrow">
        <input class="inp" id="pwd" type="password" inputmode="numeric" placeholder="暗号" autocomplete="off" />
        <button class="btn" id="unlockBtn">进入</button>
      </div>
      <div class="err" id="err">暗号不对，再想想～</div>
    </div>
  </div>

  <!-- 正文 -->
  <div class="wrap" id="main" style="display:none;">
    <div class="top">
      <div class="title">
        <div class="moon">🌙</div>
        <div>
          <h1>给宝宝的睡前故事</h1>
          <p class="sub" id="subtitle"></p>
        </div>
      </div>

      <div class="pill" title="只是本地记录，不会上传任何信息">
        今晚小句：<b id="quote">慢慢睡。</b>
      </div>
    </div>

    <div class="grid" id="list"></div>

    <div class="footer">
      <div>更新方式：上传音频文件 → 修改 <b>stories.json</b>。</div>
      <div>（你已经加了 <b>robots.txt</b> 很好：降低被搜索引擎收录概率。）</div>
    </div>
  </div>

  <script>
    // =========================
    // 0) 解锁（暗号：251223）
    // =========================
    const PASSWORD = "251223";
    const KEY_UNLOCK = "goodnight_unlocked_v1";

    const lockLayer = document.getElementById("lockLayer");
    const main = document.getElementById("main");
    const pwd = document.getElementById("pwd");
    const unlockBtn = document.getElementById("unlockBtn");
    const err = document.getElementById("err");

    function unlock(){
      const v = (pwd.value || "").trim();
      if(v === PASSWORD){
        localStorage.setItem(KEY_UNLOCK, "1");
        lockLayer.style.display = "none";
        main.style.display = "block";
        err.style.display = "none";
        loadStories().catch(showLoadError);
      }else{
        err.style.display = "block";
        pwd.focus();
        pwd.select();
      }
    }

    unlockBtn.addEventListener("click", unlock);
    pwd.addEventListener("keydown", (e)=>{ if(e.key === "Enter") unlock(); });

    // 已解锁过则直接进
    if(localStorage.getItem(KEY_UNLOCK) === "1"){
      lockLayer.style.display = "none";
      main.style.display = "block";
      loadStories().catch(showLoadError);
    }else{
      pwd.focus();
    }

    // =========================
    // 1) 文案（更像礼物）
    // =========================
    const QUOTES = [
      "慢慢睡。",
      "闭上眼，我在。",
      "把烦恼交给夜色。",
      "今天也很棒。",
      "别急，世界会等你。",
      "晚安，宝宝。"
    ];
    document.getElementById("quote").textContent = QUOTES[Math.floor(Math.random()*QUOTES.length)];

    const SUBS = [
      "今晚也想你。把声音留在你枕边。",
      "我不在你身边，但我在你耳边。",
      "这是我给你留的夜晚。只属于你。",
      "累了就听一会儿，再慢慢睡。",
      "来，把今天交给我。"
    ];
    document.getElementById("subtitle").textContent = SUBS[Math.floor(Math.random()*SUBS.length)];

    // =========================
    // 2) 已听标记（本地）
    // =========================
    const KEY_DONE = "goodnight_done_v2";
    function loadDoneSet(){
      try{ return new Set(JSON.parse(localStorage.getItem(KEY_DONE) || "[]")); }
      catch{ return new Set(); }
    }
    function saveDoneSet(set){
      localStorage.setItem(KEY_DONE, JSON.stringify(Array.from(set)));
    }

    // =========================
    // 3) 主逻辑：排序 + 今晚 + 往期折叠 + 单音频播放
    // =========================
    let currentAudio = null;

    function showLoadError(errObj){
      const list = document.getElementById("list");
      list.innerHTML = `<div class="card">加载失败：${errObj.message || errObj}</div>`;
    }

    async function loadStories(){
      const res = await fetch("./stories.json", { cache: "no-store" });
      if(!res.ok) throw new Error("stories.json 读取失败：" + res.status);

      let stories = await res.json();
      if(!Array.isArray(stories)) throw new Error("stories.json 必须是数组 []");

      // 按日期排序：最新在上（desc）
      stories.sort((a,b)=>{
        const da = (a.date || "").replace(/-/g,"");
        const db = (b.date || "").replace(/-/g,"");
        return db.localeCompare(da);
      });

      const list = document.getElementById("list");
      list.innerHTML = "";

      const tonight = stories[0];
      const past = stories.slice(1);

      if(!tonight){
        list.innerHTML = `<div class="card">还没有故事。把音频放进来并更新 stories.json 就好啦。</div>`;
        return;
      }

      list.appendChild(createCard(tonight, true));

      if(past.length > 0){
        const toggleBtn = document.createElement("button");
        toggleBtn.textContent = "查看往期";
        toggleBtn.className = "btn secondary";
        toggleBtn.style.margin = "18px auto 0";
        toggleBtn.style.display = "block";

        const hint = document.createElement("div");
        hint.className = "divider";
        hint.style.textAlign = "center";
        hint.textContent = "往期会被折叠起来，保持今晚的仪式感。";

        const pastContainer = document.createElement("div");
        pastContainer.style.display = "none";
        pastContainer.style.marginTop = "14px";
        pastContainer.style.display = "none";

        past.forEach(s => pastContainer.appendChild(createCard(s, false)));

        toggleBtn.onclick = () => {
          const show = pastContainer.style.display === "none";
          pastContainer.style.display = show ? "block" : "none";
          toggleBtn.textContent = show ? "收起往期" : "查看往期";
        };

        list.appendChild(toggleBtn);
        list.appendChild(hint);
        list.appendChild(pastContainer);
      }
    }

    function createCard(s, isTonight){
      const done = loadDoneSet();
      const id = s.id ?? s.date ?? s.file; // 建议你以后加 id 更稳

      const card = document.createElement("div");
      card.className = "card";

      const row = document.createElement("div");
      row.className = "row";

      const left = document.createElement("div");
      left.className = "left";
      const head = isTonight ? "🌙 今晚故事" : "🕯 往期故事";
      left.innerHTML = `
        <div class="name">${head} · ${s.title ?? "未命名"}</div>
        <p class="note">${s.date ? ("📅 " + s.date + " · ") : ""}${s.note ?? ""}</p>
      `;

      const actions = document.createElement("div");
      actions.className = "actions";

      const badge = document.createElement("span");
      badge.className = "badge" + (done.has(id) ? " done" : "");
      badge.textContent = done.has(id) ? "已听过 ✅" : "未听";

      const btnPlay = document.createElement("button");
      btnPlay.className = "btn";
      btnPlay.textContent = "播放";

      const btnMark = document.createElement("button");
      btnMark.className = "btn secondary";
      btnMark.textContent = done.has(id) ? "取消已听" : "标记已听";

      actions.appendChild(badge);
      actions.appendChild(btnPlay);
      actions.appendChild(btnMark);

      row.appendChild(left);
      row.appendChild(actions);

      const audio = document.createElement("audio");
      audio.controls = true;
      audio.preload = "metadata";
      audio.src = s.file;

      // 单音频播放：新播放自动暂停旧的
      function ensureSingle(){
        if(currentAudio && currentAudio !== audio) currentAudio.pause();
        currentAudio = audio;
      }
      btnPlay.onclick = () => { ensureSingle(); audio.play(); };
      audio.addEventListener("play", ensureSingle);

      // 手动标记
      btnMark.onclick = () => {
        const set = loadDoneSet();
        if(set.has(id)) set.delete(id); else set.add(id);
        saveDoneSet(set);
        const has = set.has(id);
        badge.className = "badge" + (has ? " done" : "");
        badge.textContent = has ? "已听过 ✅" : "未听";
        btnMark.textContent = has ? "取消已听" : "标记已听";
      };

      // 播完自动标记已听
      audio.addEventListener("ended", () => {
        const set = loadDoneSet();
        if(!set.has(id)){
          set.add(id);
          saveDoneSet(set);
          badge.className = "badge done";
          badge.textContent = "已听过 ✅";
          btnMark.textContent = "取消已听";
        }
      });

      card.appendChild(row);
      card.appendChild(audio);
      return card;
    }
  </script>
</body>
</html>
