<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>给宝宝的睡前故事</title>
  <meta name="theme-color" content="#0b1020" />
  <style>
    :root{
      --bg:#070a14;
      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --muted2:rgba(255,255,255,.45);
      --shadow: 0 24px 70px rgba(0,0,0,.55);
      --radius: 22px;
      --radius2: 16px;
      --maxw: 980px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 30% 15%, rgba(125,140,255,.20), transparent 60%),
        radial-gradient(900px 600px at 85% 20%, rgba(178,140,255,.14), transparent 60%),
        radial-gradient(1000px 800px at 50% 110%, rgba(0,0,0,.80), transparent 55%),
        var(--bg);
      overflow-x:hidden;
    }

    /* Canvas behind everything */
    #night-canvas{position:fixed; inset:0; z-index:0; pointer-events:none;}

    .wrap{
      position:relative;
      z-index:1;
      width:min(var(--maxw), calc(100% - 32px));
      margin: 34px auto 60px;
    }

    .hero{
      display:flex;
      gap:18px;
      align-items:center;
      padding: 18px 18px 14px;
      border-radius: calc(var(--radius) + 6px);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .moon{
      width:64px;height:64px;border-radius:18px;
      display:grid;place-items:center;
      background: linear-gradient(180deg, rgba(124,134,255,.22), rgba(124,134,255,.08));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      flex:0 0 auto;
      font-size:30px;
    }
    .title h1{
      margin:0;
      font-size:42px;
      letter-spacing:.5px;
      line-height:1.05;
    }
    .title p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:18px;
    }
    .chip{
      margin-left:auto;
      padding: 10px 14px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(20,26,50,.35);
      color:var(--muted);
      font-size:14px;
      max-width: 320px;
      text-overflow: ellipsis;
      overflow:hidden;
      white-space:nowrap;
    }

    .status{
      margin: 18px 0 0;
      padding: 14px 16px;
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      color: var(--muted);
      backdrop-filter: blur(10px);
      display:none;
    }
    .status.show{display:block}
    .status b{color:var(--text)}

    .toolbar{
      margin: 18px 0 16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color:var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.06)}
    .btn.primary{background: rgba(124,134,255,.20); border-color: rgba(124,134,255,.35)}

    .list{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top: 10px;
    }

    .card{
      padding: 16px 16px 14px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 55px rgba(0,0,0,.40);
      backdrop-filter: blur(12px);
    }

    .cardHeader{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }
    .tagIcon{
      width:34px;height:34px;border-radius:12px;
      display:grid;place-items:center;
      background: rgba(124,134,255,.15);
      border:1px solid rgba(124,134,255,.25);
      flex:0 0 auto;
      font-size:18px;
      margin-top:2px;
    }
    .meta{
      flex:1 1 auto;
      min-width: 0;
    }
    .meta h3{
      margin:0;
      font-size:22px;
      line-height:1.1;
    }
    .meta .sub{
      margin-top:8px;
      color: var(--muted);
      font-size:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      color: var(--muted);
      font-size: 12px;
    }
    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex:0 0 auto;
    }

    audio{
      width:100%;
      margin-top: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
    }

    @media (max-width: 720px){
      .title h1{font-size: 34px;}
      .chip{display:none}
      .meta h3{font-size: 19px;}
    }
  </style>
</head>

<body>
  <canvas id="night-canvas" aria-hidden="true"></canvas>

  <div class="wrap">
    <div class="hero">
      <div class="moon">🌙</div>
      <div class="title">
        <h1>给宝宝的睡前故事</h1>
        <p id="subtitle">我不在你身边，但我在你耳边。</p>
      </div>
      <div class="chip" id="quoteChip">今晚小句：今天也很棒。</div>
    </div>

    <div class="status" id="statusBox"></div>

    <div class="toolbar">
      <button class="btn primary" id="btnTonight">只看今晚</button>
      <button class="btn" id="btnAll">查看往期</button>
    </div>

    <div class="list" id="list"></div>
  </div>

<script>
(() => {
  const STATUS = document.getElementById('statusBox');
  const LIST = document.getElementById('list');

  const QUOTES = [
    "把烦恼交给夜色。",
    "闭上眼，我在。",
    "今天也很棒。",
    "来，把今天交给我。",
    "呼吸慢一点，世界就慢下来。",
    "你很努力了，真的。"
  ];

  function showStatus(html, isError=false){
    STATUS.classList.add('show');
    STATUS.innerHTML = (isError ? "<b>加载失败：</b> " : "") + html;
  }
  function hideStatus(){
    STATUS.classList.remove('show');
    STATUS.innerHTML = "";
  }

  // Random quote
  const quote = QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('quoteChip').textContent = "今晚小句：" + quote;

  // Local storage for "heard"
  const HEARD_KEY = "goodnight_heard_v1";
  const heard = new Set(JSON.parse(localStorage.getItem(HEARD_KEY) || "[]"));

  function markHeard(id, val){
    if (val) heard.add(id);
    else heard.delete(id);
    localStorage.setItem(HEARD_KEY, JSON.stringify([...heard]));
  }

  function fmtDate(d){ return d; }
  function safeText(s){ return (s ?? "").toString(); }

  // ---------- 音频 URL 兜底：兼容 GitHub Pages / 中文空格 / # 截断 / 自动 MIME ----------
  function normalizeFilePath(file){
    let f = (file ?? "").toString().trim();
    if (f.startsWith("/")) f = f.slice(1); // 项目页避免 404
    return f;
  }
  function guessMimeType(file){
    const ext = (file.split(".").pop() || "").toLowerCase();
    const map = {
      mp3:"audio/mpeg", m4a:"audio/mp4", aac:"audio/aac",
      wav:"audio/wav", ogg:"audio/ogg", webm:"audio/webm"
    };
    return map[ext] || "";
  }
  function toSafeUrl(file){
    const f = normalizeFilePath(file);
    const encoded = encodeURI(f).replace(/#/g, "%23").replace(/\?/g, "%3F");
    return new URL(encoded, window.location.href).href;
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function render(items, mode="tonight"){
    LIST.innerHTML = "";

    items.sort((a,b) => {
      const da = (a.date || a.id || "").toString();
      const db = (b.date || b.id || "").toString();
      if (db !== da) return db.localeCompare(da);
      return (b.id || "").toString().localeCompare((a.id || "").toString());
    });

    const todayStr = new Date().toISOString().slice(0,10);
    let filtered = items;

    if (mode === "tonight") {
      const maxDate = items.length ? (items[0].date || items[0].id) : todayStr;
      filtered = items.filter(x => (x.date || x.id) === maxDate);
    }

    if (!filtered.length){
      showStatus("没有找到故事条目。请检查 stories.json。", true);
      return;
    } else hideStatus();

    for (const it of filtered){
      const id = safeText(it.id || it.date || it.title || Math.random().toString(16).slice(2));
      const date = safeText(it.date || it.id || "");
      const title = safeText(it.title || "未命名故事");
      const note = safeText(it.note || "");
      const file = safeText(it.file || "");

      const isHeard = heard.has(id);
      const srcUrl = toSafeUrl(file);
      const mime = guessMimeType(file);

      const card = document.createElement('div');
      card.className = "card";
      card.innerHTML = `
        <div class="cardHeader">
          <div class="tagIcon">🌙</div>
          <div class="meta">
            <h3>${mode==="tonight" ? "今晚故事 · " : "往期故事 · "}${escapeHtml(title)}</h3>
            <div class="sub">
              <span class="pill">🗓 ${escapeHtml(fmtDate(date))}</span>
              <span class="pill">${isHeard ? "已听" : "未听"}</span>
              ${note ? `<span class="pill">${escapeHtml(note)}</span>` : ""}
            </div>
          </div>
          <div class="actions">
            <button class="btn btnMark">${isHeard ? "标记未听" : "标记已听"}</button>
          </div>
        </div>
        <audio controls preload="metadata">
          <source src="${srcUrl}" ${mime ? `type="${mime}"` : ""}>
          你的浏览器不支持音频播放。
        </audio>
      `;

      card.querySelector('.btnMark').addEventListener('click', () => {
        const now = !heard.has(id);
        markHeard(id, now);
        render(items, mode);
      });

      const audio = card.querySelector('audio');
      audio.addEventListener('ended', () => {
        markHeard(id, true);
        render(items, mode);
      });

      audio.addEventListener('error', () => {
        showStatus(
          `音频加载失败：<code>${escapeHtml(file)}</code>。<br/>` +
          `请确认：文件已上传到仓库同级目录（或路径写对），且文件名与 stories.json 完全一致（大小写/空格/# 也算）。`,
          true
        );
      });

      LIST.appendChild(card);
    }
  }

  async function loadStories(){
    try{
      const res = await fetch("stories.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("stories.json 读取失败：" + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("stories.json 格式不对：需要是数组 []");
      return data;
    } catch (e){
      showStatus(`${escapeHtml(e.message)}<br/>你可以在地址栏打开 <code>/stories.json</code> 看是否能访问。`, true);
      return [];
    }
  }

  // UI buttons
  let allItems = [];
  let mode = "tonight";

  document.getElementById('btnTonight').addEventListener('click', () => {
    mode = "tonight";
    render(allItems, mode);
  });
  document.getElementById('btnAll').addEventListener('click', () => {
    mode = "all";
    render(allItems, mode);
  });

  // =========================
  // 星空 + 升空烟花（自动）+ 手动点爆
  // =========================
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById('night-canvas');
  const ctx = canvas.getContext('2d', { alpha: true });

  let W=0, H=0, DPR=1;

  function resizeCanvas(){
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resizeCanvas, { passive:true });
  resizeCanvas();

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // Stars
  const stars = [];
  const STAR_COUNT = prefersReduced ? 60 : 160;

  function initStars(){
    stars.length = 0;
    for(let i=0;i<STAR_COUNT;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: rand(0.6,1.6),
        a: rand(0.25,0.9),
        tw: rand(0.004,0.014)*(Math.random()<0.5?1:-1),
        drift: rand(-0.015,0.015)
      });
    }
  }
  initStars();

  // Particles
  const particles = [];
  function pushParticle(p){ particles.push(p); }

  // Rockets (升空主体)
  const rockets = [];

  function drawVignette(){
    const g = ctx.createRadialGradient(W*0.5, H*0.35, 0, W*0.5, H*0.5, Math.max(W,H));
    g.addColorStop(0, 'rgba(10, 18, 40, 0.18)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0.58)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  // ----------- 爆炸：普通（含 mix/blue/gold/fantasy）-----------
  function spawnExplosion(x,y, style="fantasy"){
    const count = (style==="gold") ? Math.floor(rand(60,85))
               : (style==="mix")  ? Math.floor(rand(70,95))
               : (style==="blue") ? Math.floor(rand(55,80))
               : Math.floor(rand(45,70));

    for(let i=0;i<count;i++){
      const angle = (Math.PI*2)*(i/count) + rand(-0.06,0.06);
      const speed = (style==="gold") ? rand(1.6,4.4)
                  : (style==="mix")  ? rand(1.5,4.6)
                  : (style==="blue") ? rand(1.4,4.2)
                  : rand(1.2,3.8);

      let hue, sat, light;
      if(style==="fantasy"){
        hue = (Math.random()<0.15) ? rand(255,270) : rand(300,335); // 粉紫
        sat = 92; light = 74;
      } else if(style==="gold"){
        hue = rand(38,62); sat = 96; light = rand(58,66);
      } else if(style==="blue"){
        hue = rand(195,220); sat = 92; light = rand(62,74);
      } else {
        const pick = Math.random();
        if(pick < 0.40){ hue = rand(305,335); sat = 92; light = 74; } // 粉
        else if(pick < 0.75){ hue = rand(38,62); sat = 96; light = rand(58,66); } // 金
        else { hue = rand(195,220); sat = 92; light = rand(62,74); } // 蓝
      }

      pushParticle({
        x,y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        g: (style==="gold") ? 0.055 : 0.045,
        drag: (style==="gold") ? 0.982 : 0.985,
        a: 1,
        fade: (style==="gold") ? rand(0.010,0.020) : rand(0.008,0.018),
        r: (style==="gold") ? rand(1.4,2.3) : rand(1.2,2.1),
        hue, sat, light,
        sparkle: (style==="gold") ? rand(0.12,0.30) : rand(0.06,0.20),
        style
      });
    }
  }

  // ----------- 玫瑰烟花：更“久”（更慢 fade）-----------
  function spawnRoseFirework(x,y){
    const petals = 5;
    const count = Math.floor(rand(140, 190));
    const A = rand(22, 52);
    const baseSpeed = rand(0.85, 1.35);

    // 花心轻闪一下（更浪漫）
    for(let k=0;k<20;k++){
      const ang = rand(0, Math.PI*2);
      const sp = rand(0.3, 1.2);
      pushParticle({
        x,y,
        vx: Math.cos(ang)*sp,
        vy: Math.sin(ang)*sp,
        g: 0.015,
        drag: 0.990,
        a: 1,
        fade: rand(0.004, 0.008),  // 也更久
        r: rand(1.2, 2.4),
        hue: rand(335, 350),
        sat: 92,
        light: rand(72, 82),
        sparkle: rand(0.05, 0.12),
        style:"rose_core"
      });
    }

    for(let i=0;i<count;i++){
      const t = (Math.PI*2) * (i / count);
      const rCurve = A * Math.sin(petals * t);

      const dx = Math.cos(t) * rCurve;
      const dy = Math.sin(t) * rCurve;

      const angle = Math.atan2(dy, dx) + rand(-0.12, 0.12);
      const speed = baseSpeed * (1.0 + Math.abs(rCurve)/A) * rand(0.9, 1.25);

      const pick = Math.random();
      const hue = (pick < 0.55) ? rand(332, 350) : rand(0, 12); // 粉/红
      const sat = 92;
      const light = (pick < 0.55) ? rand(70, 80) : rand(62, 74);

      pushParticle({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        g: 0.026,
        drag: 0.991,
        a: 1,
        fade: rand(0.0035, 0.0075), // 关键：更慢消散（更久）
        r: rand(1.1, 2.1),
        hue, sat, light,
        sparkle: rand(0.05, 0.16),
        style:"rose"
      });
    }
  }

  // ----------- 爱心烟花（粉色）-----------
  function spawnHeartFirework(x,y){
    // 心形曲线参数方程：x = 16 sin^3 t, y = 13 cos t - 5 cos 2t - 2 cos 3t - cos 4t
    const count = Math.floor(rand(150, 210));
    const scale = rand(1.25, 1.75);
    const baseSpeed = rand(0.85, 1.25);

    for(let i=0;i<count;i++){
      const t = (Math.PI*2) * (i / count);
      const sx = 16 * Math.pow(Math.sin(t), 3);
      const sy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

      // 画面 y 轴向下，所以要把 sy 翻一下
      const px = sx * scale;
      const py = -sy * scale;

      // 粒子位置在心形上，速度向外（从中心指向该点）
      const ang = Math.atan2(py, px) + rand(-0.10, 0.10);
      const sp = baseSpeed * (0.8 + rand(0, 0.7));

      // 让心形更“圆润”：靠近尖角的地方速度稍弱
      const w = clamp(1 - Math.abs(Math.sin(t))*0.25, 0.6, 1.0);
      const speed = sp * w;

      pushParticle({
        x: x + px,
        y: y + py,
        vx: Math.cos(ang)*speed,
        vy: Math.sin(ang)*speed,
        g: 0.020,
        drag: 0.992,
        a: 1,
        fade: rand(0.0045, 0.010),
        r: rand(1.1, 2.0),
        hue: rand(330, 350), // 粉
        sat: 92,
        light: rand(70, 82),
        sparkle: rand(0.06, 0.18),
        style:"heart"
      });
    }

    // 轻微花心亮点
    for(let k=0;k<18;k++){
      const ang = rand(0, Math.PI*2);
      const sp = rand(0.2, 1.0);
      pushParticle({
        x,y,
        vx: Math.cos(ang)*sp,
        vy: Math.sin(ang)*sp,
        g: 0.012,
        drag: 0.993,
        a: 1,
        fade: rand(0.006, 0.012),
        r: rand(1.0, 2.2),
        hue: rand(330, 350),
        sat: 92,
        light: rand(74, 86),
        sparkle: rand(0.05, 0.14),
        style:"heart_core"
      });
    }
  }

  // ----------- 升空火箭（动线合理：底部起飞 → 顶部炸开）-----------
  function launchRocket(kind){
    // kind: "mix" | "rose" | "heart"
    const x0 = rand(W*0.18, W*0.82);
    const y0 = H + rand(20, 80); // 从屏幕下方开始
    const targetY = rand(H*0.12, H*0.42); // 合理爆炸高度
    const drift = rand(-0.35, 0.35); // 轻微横向飘
    const upSpeed = rand(6.8, 9.6); // 初速度

    const color = (kind==="rose" || kind==="heart")
      ? { hue: rand(332, 350), sat: 92, light: 72 }
      : { hue: rand(38, 62), sat: 96, light: 62 };

    rockets.push({
      x: x0,
      y: y0,
      vx: drift,
      vy: -upSpeed,
      targetY,
      kind,
      hue: color.hue,
      sat: color.sat,
      light: color.light,
      life: 0
    });
  }

  function explodeRocket(r){
    if(r.kind === "mix"){
      spawnExplosion(r.x, r.y, "mix");
    } else if(r.kind === "rose"){
      spawnRoseFirework(r.x, r.y);
    } else if(r.kind === "heart"){
      spawnHeartFirework(r.x, r.y);
    }
  }

  // ----------- 自动节奏（错开）-----------
  function scheduleAuto(){
    if(prefersReduced) return;

    // 1) 普通（mix：粉+金+蓝）——约10秒2个
    const normalBase = 10000;
    const normalStart = 1200 + rand(0, 900);

    // 2) 玫瑰（粉+红）——约10秒2个，错开
    const roseBase = 10000;
    const roseStart = 5200 + rand(0, 1100);

    // 3) 爱心（粉）——约5秒2个
    const heartBase = 5000;
    const heartStart = 2600 + rand(0, 700);

    function normalRound(){
      launchRocket("mix");
      setTimeout(() => launchRocket("mix"), 1300 + rand(0, 1500));
      setTimeout(normalRound, normalBase + rand(-900, 1200));
    }

    function roseRound(){
      launchRocket("rose");
      setTimeout(() => launchRocket("rose"), 1500 + rand(0, 1600));
      setTimeout(roseRound, roseBase + rand(-900, 1200));
    }

    function heartRound(){
      launchRocket("heart");
      setTimeout(() => launchRocket("heart"), 700 + rand(0, 900));
      setTimeout(heartRound, heartBase + rand(-450, 650));
    }

    setTimeout(normalRound, normalStart);
    setTimeout(roseRound, roseStart);
    setTimeout(heartRound, heartStart);
  }
  scheduleAuto();

  // ----------- 手动交互：左键金 / 右键粉紫（直接点爆，不走升空）-----------
  window.addEventListener('contextmenu', (e) => e.preventDefault(), { passive:false });

  window.addEventListener('mousedown', (e) => {
    if(prefersReduced) return;
    // 只在天空区域触发，避免点到播放器
    if(e.clientY >= H * 0.70) return;

    if(e.button === 0){
      spawnExplosion(e.clientX, e.clientY, "gold");
    } else if(e.button === 2){
      e.preventDefault();
      spawnExplosion(e.clientX, e.clientY, "fantasy");
    }
  }, { passive:false });

  // ----------- 主循环（含火箭升空）-----------
  function tick(){
    ctx.clearRect(0,0,W,H);

    // stars
    for(const s of stars){
      s.a += s.tw;
      if(s.a < 0.15 || s.a > 0.95) s.tw *= -1;
      s.x += s.drift;
      if(s.x < -10) s.x = W+10;
      if(s.x > W+10) s.x = -10;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }

    // rockets
    for(let i=rockets.length-1;i>=0;i--){
      const r = rockets[i];
      r.life += 1;

      // 空气阻力 + 重力（让动线更合理：上升变慢）
      r.vx *= 0.996;
      r.vy *= 0.996;
      r.vy += 0.030; // 重力（下拉）

      r.x += r.vx;
      r.y += r.vy;

      // 尾焰拖尾（从火箭身后喷出）
      const tailCount = 3;
      for(let k=0;k<tailCount;k++){
        const jitterX = rand(-0.8, 0.8);
        const jitterY = rand(-0.8, 0.8);
        const hue = (r.kind==="mix")
          ? (Math.random()<0.5 ? rand(38,62) : rand(305,335))
          : r.hue;

        pushParticle({
          x: r.x + jitterX,
          y: r.y + jitterY,
          vx: rand(-0.25, 0.25) - r.vx*0.15,
          vy: rand(0.6, 1.4) - r.vy*0.10,
          g: 0.020,
          drag: 0.965,
          a: 0.9,
          fade: rand(0.035, 0.060),
          r: rand(1.2, 2.2),
          hue,
          sat: 90,
          light: rand(55, 72),
          sparkle: rand(0.05, 0.12),
          style: "trail"
        });
      }

      // 火箭头（小亮点）
      ctx.beginPath();
      ctx.fillStyle = `hsla(${r.hue}, ${r.sat}%, ${r.light}%, 0.95)`;
      ctx.arc(r.x, r.y, 1.8, 0, Math.PI*2);
      ctx.fill();

      // 到达目标高度 或 上升速度接近停止 时爆炸
      if(r.y <= r.targetY || r.vy > -0.6){
        explodeRocket(r);
        rockets.splice(i,1);
      }

      // 越界保护
      if(r.life > 260){
        rockets.splice(i,1);
      }
    }

    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.a -= p.fade;

      if(p.a <= 0){
        particles.splice(i,1);
        continue;
      }

      const flicker = (Math.random() < p.sparkle) ? rand(-0.18,0.10) : 0;
      const alpha = Math.max(0, Math.min(1, p.a + flicker));

      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`;
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
    }

    drawVignette();
    requestAnimationFrame(tick);
  }
  tick();

  // Load stories
  (async () => {
    allItems = await loadStories();
    render(allItems, "tonight");
  })();

})();
</script>
