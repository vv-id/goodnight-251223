<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>给宝宝的睡前故事</title>
  <meta name="theme-color" content="#0b1020" />

  <style>
    :root{
      --bg:#070a14;
      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --shadow: 0 24px 70px rgba(0,0,0,.55);
      --radius: 22px;
      --radius2: 16px;
      --maxw: 980px;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 30% 15%, rgba(125,140,255,.20), transparent 60%),
        radial-gradient(900px 600px at 85% 20%, rgba(178,140,255,.14), transparent 60%),
        radial-gradient(1000px 800px at 50% 110%, rgba(0,0,0,.80), transparent 55%),
        var(--bg);
      overflow-x:hidden;
    }

    /* Canvas behind everything */
    #night-canvas{position:fixed; inset:0; z-index:0; pointer-events:none;}

    .wrap{
      position:relative;
      z-index:1;
      width:min(var(--maxw), calc(100% - 32px));
      margin: 34px auto 60px;
    }

    .hero{
      display:flex;
      gap:18px;
      align-items:center;
      padding: 18px 18px 14px;
      border-radius: calc(var(--radius) + 6px);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .moon{
      width:64px;height:64px;border-radius:18px;
      display:grid;place-items:center;
      background: linear-gradient(180deg, rgba(124,134,255,.22), rgba(124,134,255,.08));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      flex:0 0 auto;
      font-size:30px;
    }
    .title h1{
      margin:0;
      font-size:42px;
      letter-spacing:.5px;
      line-height:1.05;
    }
    .title p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:18px;
    }
    .chip{
      margin-left:auto;
      padding: 10px 14px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(20,26,50,.35);
      color:var(--muted);
      font-size:14px;
      max-width: 320px;
      text-overflow: ellipsis;
      overflow:hidden;
      white-space:nowrap;
    }

    .status{
      margin: 18px 0 0;
      padding: 14px 16px;
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      color: var(--muted);
      backdrop-filter: blur(10px);
      display:none;
    }
    .status.show{display:block}
    .status b{color:var(--text)}

    .toolbar{
      margin: 18px 0 16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color:var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.06)}
    .btn.primary{background: rgba(124,134,255,.20); border-color: rgba(124,134,255,.35)}

    .list{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top: 10px;
    }

    .card{
      padding: 16px 16px 14px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 55px rgba(0,0,0,.40);
      backdrop-filter: blur(12px);
    }

    .cardHeader{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }
    .tagIcon{
      width:34px;height:34px;border-radius:12px;
      display:grid;place-items:center;
      background: rgba(124,134,255,.15);
      border:1px solid rgba(124,134,255,.25);
      flex:0 0 auto;
      font-size:18px;
      margin-top:2px;
    }
    .meta{
      flex:1 1 auto;
      min-width: 0;
    }
    .meta h3{
      margin:0;
      font-size:22px;
      line-height:1.1;
    }
    .meta .sub{
      margin-top:8px;
      color: var(--muted);
      font-size:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      color: var(--muted);
      font-size: 12px;
    }
    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex:0 0 auto;
    }

    audio{
      width:100%;
      margin-top: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
    }

    /* ==========================================================
       右下角 2D 桌宠：Sky Dragon（趴姿）
       ========================================================== */
    .petDock{
      position: fixed;
      right: 14px;
      bottom: 14px;
      width: 6.7cm;
      height: 6.7cm;
      max-width: 290px;
      max-height: 290px;
      min-width: 200px;
      min-height: 200px;
      z-index: 9999;

      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow: 0 18px 55px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
      overflow: hidden;

      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      cursor: grab;
    }
    .petDock:active{ cursor: grabbing; }

    .petHint{
      position:absolute;
      left:12px; top:10px;
      font-size:12px;
      color:rgba(255,255,255,.55);
      letter-spacing:.2px;
      user-select:none;
      pointer-events:none;
    }

    .petSvg{ width:100%; height:100%; display:block; }

    /* 动作 */
    @keyframes petBreath { 0%,100%{ transform: translateY(0) scale(1);} 50%{ transform: translateY(2px) scale(1.01);} }
    @keyframes petTail   { 0%,100%{ transform: rotate(-6deg);} 50%{ transform: rotate(10deg);} }
    @keyframes petWingL  { 0%,100%{ transform: rotate(-3deg) translateY(0);} 50%{ transform: rotate(8deg) translateY(-1px);} }
    @keyframes petWingR  { 0%,100%{ transform: rotate(3deg) translateY(0);} 50%{ transform: rotate(-8deg) translateY(-1px);} }

    .petBody { transform-origin: 52% 62%; animation: petBreath 3.6s ease-in-out infinite; }
    .petTail { transform-origin: 84% 68%; animation: petTail 2.4s ease-in-out infinite; }
    .petWingL{ transform-origin: 62% 54%; animation: petWingL 1.55s ease-in-out infinite; }
    .petWingR{ transform-origin: 68% 56%; animation: petWingR 1.55s ease-in-out infinite; }

    .petBlink .eyeOpen{ opacity:0; }
    .petBlink .eyeClosed{ opacity:1; }
    .eyeClosed{ opacity:0; }

    .petSvg .inkOuter{
      stroke: rgba(20,26,50,0.62);
      stroke-width: 8.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      paint-order: stroke fill;
    }
    .petSvg .inkInner{
      stroke: rgba(255,255,255,0.22);
      stroke-width: 4.0;
      stroke-linecap: round;
      stroke-linejoin: round;
      paint-order: stroke fill;
    }
    .petSvg .soft{ filter: url(#petSoft); }

    @media (max-width: 720px){
      .title h1{font-size: 34px;}
      .chip{display:none}
      .meta h3{font-size: 19px;}
      .petDock{
        right: 10px; bottom: 10px;
        width: 5.9cm; height: 5.9cm;
        min-width: 185px; min-height: 185px;
      }
    }
  </style>
</head>

<script>
(() => {
  const STATUS = document.getElementById('statusBox');
  const LIST = document.getElementById('list');

  const QUOTES = [
    "把烦恼交给夜色。",
    "闭上眼，我在。",
    "今天也很棒。",
    "来，把今天交给我。",
    "呼吸慢一点，世界就慢下来。",
    "你很努力了，真的。"
  ];

  function showStatus(html, isError=false){
    STATUS.classList.add('show');
    STATUS.innerHTML = (isError ? "<b>加载失败：</b> " : "") + html;
  }
  function hideStatus(){
    STATUS.classList.remove('show');
    STATUS.innerHTML = "";
  }

  const quote = QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('quoteChip').textContent = "今晚小句：" + quote;

  const HEARD_KEY = "goodnight_heard_v1";
  const heard = new Set(JSON.parse(localStorage.getItem(HEARD_KEY) || "[]"));

  function markHeard(id, val){
    if (val) heard.add(id);
    else heard.delete(id);
    localStorage.setItem(HEARD_KEY, JSON.stringify([...heard]));
  }

  function safeText(s){ return (s ?? "").toString(); }

  function normalizeFilePath(file){
    let f = (file ?? "").toString().trim();
    if (f.startsWith("/")) f = f.slice(1);
    return f;
  }
  function guessMimeType(file){
    const ext = (file.split(".").pop() || "").toLowerCase();
    const map = { mp3:"audio/mpeg", m4a:"audio/mp4", aac:"audio/aac", wav:"audio/wav", ogg:"audio/ogg", webm:"audio/webm" };
    return map[ext] || "";
  }
  function toSafeUrl(file){
    const f = normalizeFilePath(file);
    const encoded = encodeURI(f).replace(/#/g, "%23").replace(/\?/g, "%3F");
    return new URL(encoded, window.location.href).href;
  }
  function escapeHtml(str){
    return str.replace(/[&<>"']/g, (m) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]));
  }

  function render(items, mode="tonight"){
    LIST.innerHTML = "";

    items.sort((a,b) => {
      const da = (a.date || a.id || "").toString();
      const db = (b.date || b.id || "").toString();
      if (db !== da) return db.localeCompare(da);
      return (b.id || "").toString().localeCompare((a.id || "").toString());
    });

    const todayStr = new Date().toISOString().slice(0,10);
    let filtered = items;

    if (mode === "tonight") {
      const maxDate = items.length ? (items[0].date || items[0].id) : todayStr;
      filtered = items.filter(x => (x.date || x.id) === maxDate);
    }

    if (!filtered.length){
      showStatus("没有找到故事条目。请检查 stories.json。", true);
      return;
    } else hideStatus();

    for (const it of filtered){
      const id = safeText(it.id || it.date || it.title || Math.random().toString(16).slice(2));
      const date = safeText(it.date || it.id || "");
      const title = safeText(it.title || "未命名故事");
      const note = safeText(it.note || "");
      const file = safeText(it.file || "");

      const isHeard = heard.has(id);
      const srcUrl = toSafeUrl(file);
      const mime = guessMimeType(file);

      const card = document.createElement('div');
      card.className = "card";
      card.innerHTML = `
        <div class="cardHeader">
          <div class="tagIcon">🌙</div>
          <div class="meta">
            <h3>${mode==="tonight" ? "今晚故事 · " : "往期故事 · "}${escapeHtml(title)}</h3>
            <div class="sub">
              <span class="pill">🗓 ${escapeHtml(date)}</span>
              <span class="pill">${isHeard ? "已听" : "未听"}</span>
              ${note ? `<span class="pill">${escapeHtml(note)}</span>` : ""}
            </div>
          </div>
          <div class="actions">
            <button class="btn btnMark">${isHeard ? "标记未听" : "标记已听"}</button>
          </div>
        </div>
        <audio controls preload="metadata">
          <source src="${srcUrl}" ${mime ? `type="${mime}"` : ""}>
          你的浏览器不支持音频播放。
        </audio>
      `;

      card.querySelector('.btnMark').addEventListener('click', () => {
        const now = !heard.has(id);
        markHeard(id, now);
        render(items, mode);
      });

      const audio = card.querySelector('audio');
      audio.addEventListener('ended', () => {
        markHeard(id, true);
        render(items, mode);
      });

      audio.addEventListener('error', () => {
        showStatus(
          `音频加载失败：<code>${escapeHtml(file)}</code>。<br/>` +
          `请确认：文件已上传到仓库同级目录（或路径写对），且文件名与 stories.json 完全一致（大小写/空格/# 也算）。`,
          true
        );
      });

      LIST.appendChild(card);
    }
  }

  async function loadStories(){
    try{
      const res = await fetch("stories.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("stories.json 读取失败：" + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("stories.json 格式不对：需要是数组 []");
      return data;
    } catch (e){
      showStatus(`${escapeHtml(e.message)}<br/>你可以在地址栏打开 <code>/stories.json</code> 看是否能访问。`, true);
      return [];
    }
  }

  let allItems = [];
  let mode = "tonight";

  document.getElementById('btnTonight').addEventListener('click', () => {
    mode = "tonight";
    render(allItems, mode);
  });
  document.getElementById('btnAll').addEventListener('click', () => {
    mode = "all";
    render(allItems, mode);
  });

  // ==========================================================
  // 桌宠：眨眼 + 拖拽
  // ==========================================================
  (() => {
    const petDock = document.getElementById('petDock');
    const petSvg  = document.getElementById('petSvg');
    if(!petDock || !petSvg) return;

    let blinking = false;
    function blinkOnce(){
      if(blinking) return;
      blinking = true;
      petSvg.classList.add('petBlink');
      setTimeout(() => {
        petSvg.classList.remove('petBlink');
        blinking = false;
      }, 140);
    }
    setInterval(() => { if(Math.random() < 0.28) blinkOnce(); }, 1400);

    let dragging = false;
    let startX=0, startY=0, startRight=0, startBottom=0;

    const px = (v) => (parseFloat(String(v||"0").replace("px","")) || 0);

    function onDown(e){
      dragging = true;
      petDock.setPointerCapture?.(e.pointerId);
      const cs = getComputedStyle(petDock);
      startRight = px(cs.right);
      startBottom = px(cs.bottom);
      startX = e.clientX;
      startY = e.clientY;
      e.preventDefault();
    }
    function onMove(e){
      if(!dragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      petDock.style.right = Math.max(6, startRight - dx) + "px";
      petDock.style.bottom = Math.max(6, startBottom - dy) + "px";
    }
    function onUp(){ dragging = false; }

    petDock.addEventListener('pointerdown', onDown);
    window.addEventListener('pointermove', onMove, { passive:false });
    window.addEventListener('pointerup', onUp);
  })();

  // ==========================================================
  // 星空 + 烟花（降负载版：更少、更慢、更不容易卡）
  // ==========================================================
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas = document.getElementById('night-canvas');
  const ctx = canvas.getContext('2d', { alpha: true });

  let W=0, H=0, DPR=1;

  function resizeCanvas(){
    const raw = window.devicePixelRatio || 1;
    DPR = Math.max(1, Math.min(1.5, raw));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resizeCanvas, { passive:true });
  resizeCanvas();

  function rand(min,max){ return Math.random()*(max-min)+min; }

  // Stars
  const stars = [];
  const STAR_COUNT = prefersReduced ? 45 : 95;   /* 少一点 */
  function initStars(){
    stars.length = 0;
    for(let i=0;i<STAR_COUNT;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: rand(0.6,1.4),
        a: rand(0.25,0.85),
        tw: rand(0.004,0.012)*(Math.random()<0.5?1:-1),
        drift: rand(-0.010,0.010)
      });
    }
  }
  initStars();

  const particles = [];
  const rockets = [];

  /* 关键：粒子硬上限更低（之前 1100） */
  const MAX_PARTICLES = prefersReduced ? 260 : 650;

  function pushParticle(p){
    particles.push(p);
    if(particles.length > MAX_PARTICLES){
      particles.splice(0, particles.length - MAX_PARTICLES);
    }
  }

  function drawVignette(){
    const g = ctx.createRadialGradient(W*0.5, H*0.35, 0, W*0.5, H*0.5, Math.max(W,H));
    g.addColorStop(0, 'rgba(10, 18, 40, 0.18)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0.58)');
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  function spawnExplosion(x,y, style="mix"){
    /* 关键：每次爆炸粒子更少（之前 30~48） */
    const count = (style==="gold") ? Math.floor(rand(20,30))
               : (style==="fantasy") ? Math.floor(rand(18,28))
               : Math.floor(rand(18,32));

    for(let i=0;i<count;i++){
      const angle = (Math.PI*2)*(i/count) + rand(-0.08,0.08);

      /* 关键：速度范围略降（更省持续计算） */
      const speed = (style==="gold") ? rand(2.4,5.0)
                  : (style==="fantasy") ? rand(2.2,4.7)
                  : rand(2.2,4.8);

      let hue, sat, light;
      if(style==="fantasy"){
        hue = (Math.random()<0.20) ? rand(250,270) : rand(305,335);
        sat = 92; light = 74;
      } else if(style==="gold"){
        hue = rand(38,62); sat = 96; light = rand(56,66);
      } else {
        const pick = Math.random();
        if(pick < 0.40){ hue = rand(305,335); sat = 92; light = 74; }
        else if(pick < 0.75){ hue = rand(38,62); sat = 96; light = rand(56,66); }
        else { hue = rand(195,220); sat = 92; light = rand(62,74); }
      }

      pushParticle({
        x,y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        g: 0.040,
        drag: 0.986,
        a: 1,
        fade: rand(0.014,0.022),  /* 略快点消失 */
        r: rand(1.1,1.9),
        hue, sat, light,
        sparkle: rand(0.05,0.16),
        glow: rand(10, 18),
        style
      });
    }
  }

  function spawnHeartFirework(x,y){
    /* 关键：心形粒子更少 */
    const count = Math.floor(rand(55, 80));
    const scale = rand(1.10, 1.45);
    const baseSpeed = rand(2.0, 3.8);

    for(let i=0;i<count;i++){
      const t = (Math.PI*2) * (i / count);
      const sx = 16 * Math.pow(Math.sin(t), 3);
      const sy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      const px = sx * scale;
      const py = -sy * scale;

      const ang = Math.atan2(py, px) + rand(-0.10, 0.10);
      const speed = baseSpeed * (0.75 + rand(0,0.55));

      pushParticle({
        x: x + px, y: y + py,
        vx: Math.cos(ang)*speed,
        vy: Math.sin(ang)*speed,
        g: 0.030,
        drag: 0.988,
        a: 1,
        fade: rand(0.016, 0.024),
        r: rand(1.0, 1.8),
        hue: rand(330, 350),
        sat: 92,
        light: rand(70, 84),
        sparkle: rand(0.05, 0.14),
        glow: rand(12, 20),
        style:"heart"
      });
    }
  }

  function spawnRoseFirework(x,y){
    /* 关键：玫瑰粒子更少 */
    const petals = 5;
    const count = Math.floor(rand(60, 90));
    const A = rand(18, 38);
    const baseSpeed = rand(1.9, 3.8);

    for(let i=0;i<count;i++){
      const t = (Math.PI*2) * (i / count);
      const rCurve = A * Math.sin(petals * t);
      const dx = Math.cos(t) * rCurve;
      const dy = Math.sin(t) * rCurve;
      const angle = Math.atan2(dy, dx) + rand(-0.12, 0.12);
      const speed = baseSpeed * (1.0 + Math.abs(rCurve)/A) * rand(0.85, 1.15);

      const pick = Math.random();
      const hue = (pick < 0.60) ? rand(332, 350) : rand(0, 12);
      const light = (pick < 0.60) ? rand(70, 82) : rand(62, 76);

      pushParticle({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        g: 0.028,
        drag: 0.989,
        a: 1,
        fade: rand(0.014, 0.022),
        r: rand(1.0, 1.8),
        hue, sat: 92, light,
        sparkle: rand(0.05, 0.14),
        glow: rand(12, 20),
        style:"rose"
      });
    }
  }

  function launchRocket(kind){
    const x0 = rand(W*0.18, W*0.82);
    const y0 = H + rand(20, 90);
    const targetY = rand(H*0.12, H*0.42);
    const upSpeed = rand(7.2, 9.6); /* 略降 */
    const drift0 = rand(-0.26, 0.26);

    const hue = (kind==="mix") ? rand(38, 62)
              : (kind==="rose"||kind==="heart") ? rand(332, 350)
              : rand(38, 62);

    rockets.push({
      x: x0, y: y0,
      vx: drift0, vy: -upSpeed,
      targetY, kind,
      hue, sat: 92, light: 72,
      life: 0,
      windPhase: rand(0, Math.PI*2),
      windAmp: rand(0.14, 0.36) /* 略降 */
    });
  }

  function explodeRocket(r){
    if(r.kind === "mix") spawnExplosion(r.x, r.y, "mix");
    else if(r.kind === "rose") spawnRoseFirework(r.x, r.y);
    else if(r.kind === "heart") spawnHeartFirework(r.x, r.y);
  }

  function scheduleAuto(){
    if(prefersReduced) return;

    /* 关键：整体更慢（之前 8s/12s/10s） */
    const normalBase = 12000;
    const roseBase   = 18000;
    const heartBase  = 15000;

    function normalRound(){
      /* 关键：有概率跳过 */
      if (Math.random() < 0.60) launchRocket("mix");
      setTimeout(normalRound, normalBase + rand(-1200, 1200));
    }
    function roseRound(){
      if (Math.random() < 0.55) launchRocket("rose");
      setTimeout(roseRound, roseBase + rand(-1800, 1800));
    }
    function heartRound(){
      if (Math.random() < 0.55) launchRocket("heart");
      setTimeout(heartRound, heartBase + rand(-1500, 1500));
    }

    setTimeout(normalRound, 1200 + rand(0, 900));
    setTimeout(roseRound,   3600 + rand(0, 1200));
    setTimeout(heartRound,  5600 + rand(0, 1200));
  }
  scheduleAuto();

  /* 手动点击：冷却更长，防止狂点 */
  let lastManual = 0;
  const MANUAL_COOLDOWN = 450;

  window.addEventListener('contextmenu', (e) => e.preventDefault(), { passive:false });

  window.addEventListener('mousedown', (e) => {
    if(prefersReduced) return;
    if(e.clientY >= H * 0.70) return;

    const now = performance.now();
    if(now - lastManual < MANUAL_COOLDOWN) return;
    lastManual = now;

    if(e.button === 0){
      spawnExplosion(e.clientX, e.clientY, "gold");
    } else if(e.button === 2){
      e.preventDefault();
      spawnExplosion(e.clientX, e.clientY, "fantasy");
    }
  }, { passive:false });

  function tick(){
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(7,10,20,0.24)";
    ctx.fillRect(0,0,W,H);

    for(const s of stars){
      s.a += s.tw;
      if(s.a < 0.18 || s.a > 0.92) s.tw *= -1;
      s.x += s.drift;
      if(s.x < -10) s.x = W+10;
      if(s.x > W+10) s.x = -10;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }

    for(let i=rockets.length-1;i>=0;i--){
      const r = rockets[i];
      r.life += 1;

      r.windPhase += 0.035;
      r.vx += Math.sin(r.windPhase) * r.windAmp * 0.02;

      r.vx *= 0.996;
      r.vy *= 0.996;
      r.vy += 0.030;

      r.x += r.vx;
      r.y += r.vy;

      /* 尾焰更少 */
      for(let k=0;k<1;k++){
        let hue = r.hue;
        if(r.kind === "mix"){
          const pick = Math.random();
          hue = (pick<0.4) ? rand(305,335) : (pick<0.75) ? rand(38,62) : rand(195,220);
        }
        pushParticle({
          x: r.x + rand(-0.7,0.7),
          y: r.y + rand(-0.7,0.7),
          vx: rand(-0.18, 0.18) - r.vx*0.15,
          vy: rand(0.6, 1.2) - r.vy*0.10,
          g: 0.018,
          drag: 0.965,
          a: 0.82,
          fade: rand(0.045, 0.068),
          r: rand(1.0, 1.8),
          hue,
          sat: 90,
          light: rand(55, 72),
          sparkle: rand(0.04, 0.10),
          glow: rand(8, 14),
          style: "trail"
        });
      }

      ctx.beginPath();
      ctx.fillStyle = `hsla(${r.hue}, ${r.sat}%, ${r.light}%, 0.95)`;
      ctx.arc(r.x, r.y, 1.6, 0, Math.PI*2);
      ctx.fill();

      if(r.y <= r.targetY || r.vy > -0.6){
        explodeRocket(r);
        rockets.splice(i,1);
      }
      if(r.life > 250) rockets.splice(i,1);
    }

    ctx.globalCompositeOperation = "lighter";
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.a -= p.fade;

      if(p.a <= 0){
        particles.splice(i,1);
        continue;
      }

      const flicker = (Math.random() < p.sparkle) ? rand(-0.16,0.10) : 0;
      const alpha = Math.max(0, Math.min(1, p.a + flicker));

      ctx.save();
      ctx.shadowBlur = (p.glow || 12) + p.r * 6;
      ctx.shadowColor = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${Math.min(1, alpha)})`;
      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`;
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    drawVignette();
    requestAnimationFrame(tick);
  }
  tick();

  (async () => {
    allItems = await loadStories();
    render(allItems, "tonight");
  })();

})();
</script>

</body>
</html>
