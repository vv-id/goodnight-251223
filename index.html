<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>给宝宝的睡前故事</title>
  <meta name="theme-color" content="#0b1020" />
  <style>
    :root{
      --bg:#070a14;
      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --shadow: 0 24px 70px rgba(0,0,0,.55);
      --radius: 22px;
      --radius2: 16px;
      --maxw: 980px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 30% 15%, rgba(125,140,255,.20), transparent 60%),
        radial-gradient(900px 600px at 85% 20%, rgba(178,140,255,.14), transparent 60%),
        radial-gradient(1000px 800px at 50% 110%, rgba(0,0,0,.80), transparent 55%),
        var(--bg);
      overflow-x:hidden;
    }

    /* Canvas behind everything */
    #night-canvas{position:fixed; inset:0; z-index:0; pointer-events:none;}

    .wrap{
      position:relative;
      z-index:1;
      width:min(var(--maxw), calc(100% - 32px));
      margin: 34px auto 60px;
    }

    .hero{
      display:flex;
      gap:18px;
      align-items:center;
      padding: 18px 18px 14px;
      border-radius: calc(var(--radius) + 6px);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .moon{
      width:64px;height:64px;border-radius:18px;
      display:grid;place-items:center;
      background: linear-gradient(180deg, rgba(124,134,255,.22), rgba(124,134,255,.08));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      flex:0 0 auto;
      font-size:30px;
    }
    .title h1{
      margin:0;
      font-size:42px;
      letter-spacing:.5px;
      line-height:1.05;
    }
    .title p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:18px;
    }
    .chip{
      margin-left:auto;
      padding: 10px 14px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(20,26,50,.35);
      color:var(--muted);
      font-size:14px;
      max-width: 320px;
      text-overflow: ellipsis;
      overflow:hidden;
      white-space:nowrap;
    }

    .status{
      margin: 18px 0 0;
      padding: 14px 16px;
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      color: var(--muted);
      backdrop-filter: blur(10px);
      display:none;
    }
    .status.show{display:block}
    .status b{color:var(--text)}
    .status code{font-family:var(--mono)}

    .toolbar{
      margin: 18px 0 16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color:var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.06)}
    .btn.primary{background: rgba(124,134,255,.20); border-color: rgba(124,134,255,.35)}

    .list{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top: 10px;
    }

    .card{
      padding: 16px 16px 14px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 55px rgba(0,0,0,.40);
      backdrop-filter: blur(12px);
    }

    .cardHeader{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }
    .tagIcon{
      width:34px;height:34px;border-radius:12px;
      display:grid;place-items:center;
      background: rgba(124,134,255,.15);
      border:1px solid rgba(124,134,255,.25);
      flex:0 0 auto;
      font-size:18px;
      margin-top:2px;
    }
    .meta{
      flex:1 1 auto;
      min-width: 0;
    }
    .meta h3{
      margin:0;
      font-size:22px;
      line-height:1.1;
    }
    .meta .sub{
      margin-top:8px;
      color: var(--muted);
      font-size:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      color: var(--muted);
      font-size: 12px;
    }
    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex:0 0 auto;
    }

    audio{
      width:100%;
      margin-top: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
    }

    /* ===== 右下角 2D 桌宠：Sky Dragon（趴姿） ===== */
    .petDock{
      position: fixed;
      right: 14px;
      bottom: 14px;

      /* 更小一点 */
      width: 6.4cm;
      height: 6.4cm;
      max-width: 280px;
      max-height: 280px;
      min-width: 190px;
      min-height: 190px;

      z-index: 9999;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow: 0 18px 55px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
      overflow: hidden;

      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
      cursor: grab;
    }
    .petDock:active{ cursor: grabbing; }

    .petHint{
      position:absolute;
      left:12px; top:10px;
      font-size:12px;
      color:rgba(255,255,255,.55);
      letter-spacing:.2px;
      user-select:none;
      pointer-events:none;
    }

    .petSvg{ width:100%; height:100%; display:block; }

    /* 动作 */
    @keyframes petBreath { 0%,100%{ transform: translateY(0) scale(1);} 50%{ transform: translateY(2px) scale(1.01);} }
    @keyframes petTail   { 0%,100%{ transform: rotate(-5deg);} 50%{ transform: rotate(8deg);} }
    @keyframes petWingL  { 0%,100%{ transform: rotate(-2deg) translateY(0);} 50%{ transform: rotate(7deg) translateY(-1px);} }
    @keyframes petWingR  { 0%,100%{ transform: rotate(2deg) translateY(0);} 50%{ transform: rotate(-7deg) translateY(-1px);} }

    .petBody { transform-origin: 52% 62%; animation: petBreath 3.6s ease-in-out infinite; }
    .petTail { transform-origin: 84% 62%; animation: petTail 2.4s ease-in-out infinite; }
    .petWingL{ transform-origin: 60% 50%; animation: petWingL 1.6s ease-in-out infinite; }
    .petWingR{ transform-origin: 66% 52%; animation: petWingR 1.6s ease-in-out infinite; }

    /* 眨眼：class 切换 */
    .petBlink .eyeOpen{ opacity:0; }
    .petBlink .eyeClosed{ opacity:1; }
    .eyeClosed{ opacity:0; }

    @media (max-width: 720px){
      .title h1{font-size: 34px;}
      .chip{display:none}
      .meta h3{font-size: 19px;}
      .petDock{ right: 10px; bottom: 10px; width: 5.6cm; height: 5.6cm; min-width: 170px; min-height: 170px; }
    }
  </style>
</head>

<body>
  <canvas id="night-canvas" aria-hidden="true"></canvas>

  <div class="wrap">
    <div class="hero">
      <div class="moon">🌙</div>
      <div class="title">
        <h1>给宝宝的睡前故事</h1>
        <p id="subtitle">我不在你身边，但我在你耳边。</p>
      </div>
      <div class="chip" id="quoteChip">今晚小句：今天也很棒。</div>
    </div>

    <div class="status" id="statusBox"></div>

    <div class="toolbar">
      <button class="btn primary" id="btnTonight">只看今晚</button>
      <button class="btn" id="btnAll">查看往期</button>
    </div>

    <div class="list" id="list"></div>
  </div>

  <!-- 右下角 桌宠：Sky Dragon（趴姿） -->
  <div class="petDock" id="petDock" aria-label="桌宠：天空龙">
    <div class="petHint">拖我一下～</div>

    <svg class="petSvg" id="petSvg" viewBox="0 0 360 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- 2D毛绒：轻渐变 -->
        <linearGradient id="dragonBlue" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#cfe7ff"/>
          <stop offset="55%" stop-color="#9cc7ff"/>
          <stop offset="100%" stop-color="#78a7ff"/>
        </linearGradient>

        <linearGradient id="bellySoft" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#f2f8ff"/>
          <stop offset="100%" stop-color="#d9eeff"/>
        </linearGradient>

        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="rgba(0,0,0,0.30)"/>
        </filter>

        <!-- 轻“绒”边缘：克制 -->
        <filter id="plushEdge" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur stdDeviation="0.55" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <!-- 毛绒纹理：非常淡的点阵噪点 -->
        <pattern id="plushNoise" width="14" height="14" patternUnits="userSpaceOnUse">
          <circle cx="2" cy="3" r="0.8" fill="rgba(255,255,255,0.12)"/>
          <circle cx="9" cy="5" r="0.7" fill="rgba(255,255,255,0.10)"/>
          <circle cx="6" cy="11" r="0.9" fill="rgba(0,0,0,0.06)"/>
          <circle cx="12" cy="12" r="0.7" fill="rgba(255,255,255,0.08)"/>
        </pattern>

        <!-- 高光带 -->
        <linearGradient id="plushShine" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="rgba(255,255,255,0)"/>
          <stop offset="40%" stop-color="rgba(255,255,255,0.18)"/>
          <stop offset="70%" stop-color="rgba(255,255,255,0.08)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
        </linearGradient>
      </defs>

      <!-- 背景小柔光 -->
      <circle cx="72" cy="70" r="86" fill="rgba(160,180,255,0.12)"/>
      <circle cx="300" cy="90" r="66" fill="rgba(255,214,242,0.08)"/>

      <g class="petBody" filter="url(#softShadow)">

        <!-- 尾巴：更细长 -->
        <g class="petTail">
          <path d="M248 206
                   C302 206, 340 244, 314 278
                   C296 300, 260 292, 260 262
                   C260 238, 290 232, 304 248
                   C298 222, 268 214, 242 226"
                fill="none" stroke="url(#dragonBlue)" stroke-width="18"
                stroke-linecap="round" stroke-linejoin="round" filter="url(#plushEdge)"/>
          <path d="M312 274 C304 286, 286 286, 278 274"
                fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="10"
                stroke-linecap="round"/>
        </g>

        <!-- 身体主躯干：更瘦更贴地 -->
        <path d="M118 238
                 C120 196, 170 160, 238 162
                 C300 164, 328 198, 320 234
                 C312 266, 270 282, 214 286
                 C160 290, 118 270, 118 238 Z"
              fill="url(#dragonBlue)" filter="url(#plushEdge)"/>

        <!-- 毛绒噪点覆盖（超淡） -->
        <path d="M118 238
                 C120 196, 170 160, 238 162
                 C300 164, 328 198, 320 234
                 C312 266, 270 282, 214 286
                 C160 290, 118 270, 118 238 Z"
              fill="url(#plushNoise)" opacity="0.35"/>

        <!-- 轻高光 -->
        <path d="M140 230
                 C170 196, 214 184, 268 192
                 C298 198, 312 214, 314 226
                 C290 208, 254 204, 220 206
                 C184 208, 160 218, 140 230 Z"
              fill="url(#plushShine)" opacity="0.9"/>

        <!-- 肚皮：更窄 -->
        <path d="M150 246
                 C156 218, 194 192, 240 196
                 C274 199, 292 220, 286 244
                 C280 266, 252 276, 214 278
                 C178 280, 156 268, 150 246 Z"
              fill="url(#bellySoft)" opacity="0.92"/>

        <!-- 背上彩色小刺（递进更像图） -->
        <g opacity="0.95">
          <circle cx="204" cy="158" r="9.5" fill="#ff5a74"/>
          <circle cx="222" cy="152" r="9.2" fill="#ff8a3d"/>
          <circle cx="240" cy="149" r="9.0" fill="#ffd24a"/>
          <circle cx="258" cy="150" r="8.7" fill="#5fe38a"/>
          <circle cx="276" cy="156" r="8.3" fill="#47c7ff"/>
          <circle cx="292" cy="166" r="7.9" fill="#7b6cff"/>
          <circle cx="304" cy="180" r="7.4" fill="#ff84d8"/>
        </g>

        <!-- 白翅膀（左右：位置稍微更靠背） -->
        <g class="petWingL">
          <path d="M214 192
                   C192 174, 172 162, 158 172
                   C144 182, 162 208, 190 218
                   C206 224, 220 214, 224 202 Z"
                fill="rgba(255,255,255,0.95)" filter="url(#plushEdge)"/>
          <path d="M210 200 C192 192, 178 186, 170 190"
                fill="none" stroke="rgba(140,170,255,0.28)" stroke-width="3" stroke-linecap="round"/>
        </g>

        <g class="petWingR">
          <path d="M248 194
                   C270 176, 292 170, 304 186
                   C314 202, 290 222, 262 226
                   C246 228, 240 214, 242 202 Z"
                fill="rgba(255,255,255,0.92)" filter="url(#plushEdge)"/>
          <path d="M252 202 C270 196, 284 194, 294 202"
                fill="none" stroke="rgba(140,170,255,0.24)" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- 四肢（更贴地一点） -->
        <path d="M148 280
                 C132 274, 128 258, 144 250
                 C160 242, 180 252, 178 268
                 C176 282, 162 286, 148 280 Z"
              fill="url(#dragonBlue)" filter="url(#plushEdge)"/>
        <ellipse cx="152" cy="284" rx="22" ry="14" fill="rgba(255,255,255,0.96)"/>

        <path d="M262 276
                 C248 270, 246 256, 260 248
                 C274 240, 292 248, 290 262
                 C288 274, 276 280, 262 276 Z"
              fill="url(#dragonBlue)" filter="url(#plushEdge)"/>
        <ellipse cx="270" cy="282" rx="20" ry="13" fill="rgba(255,255,255,0.92)"/>

        <!-- 头：更扁、更贴地、朝左 -->
        <path d="M74 238
                 C52 224, 52 190, 78 170
                 C112 145, 160 150, 182 176
                 C198 196, 190 220, 160 238
                 C130 256, 98 252, 74 238 Z"
              fill="url(#dragonBlue)" filter="url(#plushEdge)"/>

        <!-- 长嘴：更长更扁 -->
        <path d="M38 232
                 C18 224, 18 204, 36 196
                 C60 186, 90 194, 98 212
                 C104 226, 84 242, 60 244
                 C52 244, 46 240, 38 232 Z"
              fill="url(#dragonBlue)" filter="url(#plushEdge)"/>

        <!-- 白耳/小角（嘴旁白色那块） -->
        <path d="M70 192
                 C60 180, 70 168, 86 178
                 C82 190, 78 194, 70 192 Z"
              fill="rgba(255,255,255,0.92)"/>

        <!-- 眼睛：更像商品图（侧脸小黑点）开/闭 -->
        <g id="petFace">
          <circle class="eyeOpen" cx="118" cy="186" r="6.6" fill="rgba(20,26,50,0.78)"/>
          <path class="eyeClosed" d="M110 188 C116 194, 124 194, 130 188"
                fill="none" stroke="rgba(20,26,50,0.55)" stroke-width="4" stroke-linecap="round"/>
        </g>

        <!-- 小鼻口 -->
        <path d="M58 220 C70 228, 82 228, 94 220"
              fill="none" stroke="rgba(20,26,50,0.55)" stroke-width="4" stroke-linecap="round"/>

        <!-- 轻腮红 -->
        <ellipse cx="138" cy="208" rx="14" ry="10" fill="rgba(255,214,242,0.18)"/>
      </g>
    </svg>
  </div>

<script>
(() => {
  const STATUS = document.getElementById('statusBox');
  const LIST = document.getElementById('list');

  const QUOTES = [
    "把烦恼交给夜色。",
    "闭上眼，我在。",
    "今天也很棒。",
    "来，把今天交给我。",
    "呼吸慢一点，世界就慢下来。",
    "你很努力了，真的。"
  ];

  function showStatus(html, isError=false){
    STATUS.classList.add('show');
    STATUS.innerHTML = (isError ? "<b>加载失败：</b> " : "") + html;
  }
  function hideStatus(){
    STATUS.classList.remove('show');
    STATUS.innerHTML = "";
  }

  // Random quote
  const quote = QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('quoteChip').textContent = "今晚小句：" + quote;

  // Local storage for "heard"
  const HEARD_KEY = "goodnight_heard_v1";
  const heard = new Set(JSON.parse(localStorage.getItem(HEARD_KEY) || "[]"));

  function markHeard(id, val){
    if (val) heard.add(id);
    else heard.delete(id);
    localStorage.setItem(HEARD_KEY, JSON.stringify([...heard]));
  }

  function safeText(s){ return (s ?? "").toString(); }

  // ---------- 音频 URL 兜底：兼容 GitHub Pages / 中文空格 / # 截断 / 自动 MIME ----------
  function normalizeFilePath(file){
    let f = (file ?? "").toString().trim();
    if (f.startsWith("/")) f = f.slice(1); // 项目页避免 404
    return f;
  }
  function guessMimeType(file){
    const ext = (file.split(".").pop() || "").toLowerCase();
    const map = {
      mp3:"audio/mpeg", m4a:"audio/mp4", aac:"audio/aac",
      wav:"audio/wav", ogg:"audio/ogg", webm:"audio/webm"
    };
    return map[ext] || "";
  }
  function toSafeUrl(file){
    const f = normalizeFilePath(file);
    const encoded = encodeURI(f).replace(/#/g, "%23").replace(/\?/g, "%3F");
    return new URL(encoded, window.location.href).href;
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function render(items, mode="tonight"){
    LIST.innerHTML = "";

    items.sort((a,b) => {
      const da = (a.date || a.id || "").toString();
      const db = (b.date || b.id || "").toString();
      if (db !== da) return db.localeCompare(da);
      return (b.id || "").toString().localeCompare((a.id || "").toString());
    });

    const todayStr = new Date().toISOString().slice(0,10);
    let filtered = items;

    if (mode === "tonight") {
      const maxDate = items.length ? (items[0].date || items[0].id) : todayStr;
      filtered = items.filter(x => (x.date || x.id) === maxDate);
    }

    if (!filtered.length){
      showStatus("没有找到故事条目。请检查 stories.json。", true);
      return;
    } else hideStatus();

    for (const it of filtered){
      const id = safeText(it.id || it.date || it.title || Math.random().toString(16).slice(2));
      const date = safeText(it.date || it.id || "");
      const title = safeText(it.title || "未命名故事");
      const note = safeText(it.note || "");
      const file = safeText(it.file || "");

      const isHeard = heard.has(id);
      const srcUrl = toSafeUrl(file);
      const mime = guessMimeType(file);

      const card = document.createElement('div');
      card.className = "card";
      card.innerHTML = `
        <div class="cardHeader">
          <div class="tagIcon">🌙</div>
          <div class="meta">
            <h3>${mode==="tonight" ? "今晚故事 · " : "往期故事 · "}${escapeHtml(title)}</h3>
            <div class="sub">
              <span class="pill">🗓 ${escapeHtml(date)}</span>
              <span class="pill">${isHeard ? "已听" : "未听"}</span>
              ${note ? `<span class="pill">${escapeHtml(note)}</span>` : ""}
            </div>
          </div>
          <div class="actions">
            <button class="btn btnMark">${isHeard ? "标记未听" : "标记已听"}</button>
          </div>
        </div>
        <audio controls preload="metadata">
          <source src="${srcUrl}" ${mime ? `type="${mime}"` : ""}>
          你的浏览器不支持音频播放。
        </audio>
      `;

      card.querySelector('.btnMark').addEventListener('click', () => {
        const now = !heard.has(id);
        markHeard(id, now);
        render(items, mode);
      });

      const audio = card.querySelector('audio');
      audio.addEventListener('ended', () => {
        markHeard(id, true);
        render(items, mode);
      });

      audio.addEventListener('error', () => {
        showStatus(
          `音频加载失败：<code>${escapeHtml(file)}</code>。<br/>` +
          `请确认：文件已上传到仓库同级目录（或路径写对），且文件名与 stories.json 完全一致（大小写/空格/# 也算）。`,
          true
        );
      });

      LIST.appendChild(card);
    }
  }

  async function loadStories(){
    try{
      const res = await fetch("stories.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("stories.json 读取失败：" + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("stories.json 格式不对：需要是数组 []");
      return data;
    } catch (e){
      showStatus(`${escapeHtml(e.message)}<br/>你可以在地址栏打开 <code>/stories.json</code> 看是否能访问。`, true);
      return [];
    }
  }

  // UI buttons
  let allItems = [];
  let mode = "tonight";

  document.getElementById('btnTonight').addEventListener('click', () => {
    mode = "tonight";
    render(allItems, mode);
  });
  document.getElementById('btnAll').addEventListener('click', () => {
    mode = "all";
    render(allItems, mode);
  });

  // =========================
  // 星空 + 烟花（自动更低频）+ 手动点爆（更轻量）
  // =========================
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById('night-canvas');
  const ctx = canvas.getContext('2d', { alpha: true });

  let W=0, H=0, DPR=1;

  function resizeCanvas(){
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resizeCanvas, { passive:true });
  resizeCanvas();

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // Stars
  const stars = [];
  const STAR_COUNT = prefersReduced ? 45 : 120;

  function initStars(){
    stars.length = 0;
    for(let i=0;i<STAR_COUNT;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: rand(0.6,1.5),
        a: rand(0.25,0.85),
        tw: rand(0.004,0.012)*(Math.random()<0.5?1:-1),
        drift: rand(-0.012,0.012)
      });
    }
  }
  initStars();

  // Particles / Rockets
  const particles = [];
  const rockets = [];
  function pushParticle(p){ particles.push(p); }

  function drawVignette(){
    const g = ctx.createRadialGradient(W*0.5, H*0.35, 0, W*0.5, H*0.5, Math.max(W,H));
    g.addColorStop(0, 'rgba(10, 18, 40, 0.18)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0.58)');
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  // 粒子上限：防止越堆越卡
  const MAX_PARTICLES = 900;

  function spawnExplosion(x,y, style="fantasy"){
    const count = (style==="gold") ? Math.floor(rand(36,52))
               : (style==="mix")  ? Math.floor(rand(40,58))
               : (style==="blue") ? Math.floor(rand(32,50))
               : Math.floor(rand(30,46));

    for(let i=0;i<count;i++){
      const angle = (Math.PI*2)*(i/count) + rand(-0.06,0.06);
      const speed = (style==="gold") ? rand(1.3,3.6)
                  : (style==="mix")  ? rand(1.2,3.8)
                  : (style==="blue") ? rand(1.1,3.4)
                  : rand(1.0,3.2);

      let hue, sat, light;
      if(style==="fantasy"){
        hue = (Math.random()<0.15) ? rand(255,270) : rand(300,335);
        sat = 92; light = 74;
      } else if(style==="gold"){
        hue = rand(38,62); sat = 96; light = rand(58,66);
      } else if(style==="blue"){
        hue = rand(195,220); sat = 92; light = rand(62,74);
      } else {
        const pick = Math.random();
        if(pick < 0.40){ hue = rand(305,335); sat = 92; light = 74; }
        else if(pick < 0.75){ hue = rand(38,62); sat = 96; light = rand(58,66); }
        else { hue = rand(195,220); sat = 92; light = rand(62,74); }
      }

      pushParticle({
        x,y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        g: (style==="gold") ? 0.055 : 0.045,
        drag: (style==="gold") ? 0.983 : 0.986,
        a: 1,
        fade: (style==="gold") ? rand(0.013,0.022) : rand(0.011,0.020),
        r: (style==="gold") ? rand(1.2,2.0) : rand(1.0,1.9),
        hue, sat, light,
        sparkle: rand(0.05, 0.16),
        glow: rand(8, 16),
        style
      });
    }
  }

  function spawnRoseFirework(x,y){
    const petals = 5;
    const count = Math.floor(rand(95, 135));
    const A = rand(22, 52);
    const baseSpeed = rand(0.85, 1.25);

    for(let k=0;k<12;k++){
      const ang = rand(0, Math.PI*2);
      const sp = rand(0.3, 0.95);
      pushParticle({
        x,y,
        vx: Math.cos(ang)*sp,
        vy: Math.sin(ang)*sp,
        g: 0.015,
        drag: 0.991,
        a: 1,
        fade: rand(0.0046, 0.0082),
        r: rand(1.0, 2.1),
        hue: rand(335, 350),
        sat: 92,
        light: rand(72, 84),
        sparkle: rand(0.05, 0.12),
        glow: rand(10, 18),
        style:"rose_core"
      });
    }

    for(let i=0;i<count;i++){
      const t = (Math.PI*2) * (i / count);
      const rCurve = A * Math.sin(petals * t);

      const dx = Math.cos(t) * rCurve;
      const dy = Math.sin(t) * rCurve;

      const angle = Math.atan2(dy, dx) + rand(-0.12, 0.12);
      const speed = baseSpeed * (1.0 + Math.abs(rCurve)/A) * rand(0.9, 1.2);

      const pick = Math.random();
      const hue = (pick < 0.58) ? rand(332, 350) : rand(0, 12);
      const sat = 92;
      const light = (pick < 0.58) ? rand(70, 82) : rand(62, 76);

      pushParticle({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        g: 0.024,
        drag: 0.992,
        a: 1,
        fade: rand(0.0038, 0.0074),
        r: rand(1.0, 1.9),
        hue, sat, light,
        sparkle: rand(0.05, 0.14),
        glow: rand(10, 18),
        style:"rose"
      });
    }
  }

  function spawnHeartFirework(x,y){
    const count = Math.floor(rand(95, 135));
    const scale = rand(1.20, 1.70);
    const baseSpeed = rand(0.85, 1.15);

    for(let i=0;i<count;i++){
      const t = (Math.PI*2) * (i / count);
      const sx = 16 * Math.pow(Math.sin(t), 3);
      const sy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

      const px = sx * scale;
      const py = -sy * scale;

      const ang = Math.atan2(py, px) + rand(-0.10, 0.10);
      const sp = baseSpeed * (0.8 + rand(0, 0.6));
      const w = clamp(1 - Math.abs(Math.sin(t))*0.25, 0.6, 1.0);
      const speed = sp * w;

      pushParticle({
        x: x + px,
        y: y + py,
        vx: Math.cos(ang)*speed,
        vy: Math.sin(ang)*speed,
        g: 0.020,
        drag: 0.993,
        a: 1,
        fade: rand(0.0048, 0.0098),
        r: rand(1.0, 1.8),
        hue: rand(330, 350),
        sat: 92,
        light: rand(70, 84),
        sparkle: rand(0.05, 0.14),
        glow: rand(10, 18),
        style:"heart"
      });
    }
  }

  function launchRocket(kind){
    const x0 = rand(W*0.18, W*0.82);
    const y0 = H + rand(20, 90);
    const targetY = rand(H*0.14, H*0.42);

    const upSpeed = rand(6.8, 9.0);
    const drift0 = rand(-0.26, 0.26);

    const hue = (kind==="mix") ? rand(38, 62)
              : (kind==="rose"||kind==="heart") ? rand(332, 350)
              : rand(38, 62);

    rockets.push({
      x: x0, y: y0,
      vx: drift0, vy: -upSpeed,
      targetY,
      kind,
      hue, sat: 92, light: 72,
      life: 0,
      windPhase: rand(0, Math.PI*2),
      windAmp: rand(0.14, 0.40)
    });
  }

  function explodeRocket(r){
    if(r.kind === "mix") spawnExplosion(r.x, r.y, "mix");
    else if(r.kind === "rose") spawnRoseFirework(r.x, r.y);
    else if(r.kind === "heart") spawnHeartFirework(r.x, r.y);
  }

  // 自动节奏（更低频：每轮 1 枚）
  function scheduleAuto(){
    if(prefersReduced) return;

    const normalBase = 20000;
    const roseBase   = 27000;
    const heartBase  = 16000;

    const normalStart = 1200 + rand(0, 900);
    const roseStart   = 6200 + rand(0, 900);
    const heartStart  = 3200 + rand(0, 700);

    function normalRound(){
      launchRocket("mix");
      setTimeout(normalRound, normalBase + rand(-2200, 2200));
    }
    function roseRound(){
      launchRocket("rose");
      setTimeout(roseRound, roseBase + rand(-3000, 3000));
    }
    function heartRound(){
      launchRocket("heart");
      setTimeout(heartRound, heartBase + rand(-1800, 1800));
    }

    setTimeout(normalRound, normalStart);
    setTimeout(roseRound, roseStart);
    setTimeout(heartRound, heartStart);
  }
  scheduleAuto();

  // 手动交互：轻量爆炸 + 冷却
  let lastClickFx = 0;
  const CLICK_COOLDOWN = 180;

  function spawnClickBurst(x,y, style){
    const n = Math.floor(rand(24, 34));
    for(let i=0;i<n;i++){
      const ang = rand(0, Math.PI*2);
      const sp  = rand(1.0, 2.8);

      let hue, sat=92, light=74;
      if(style === "gold"){ hue = rand(38, 62); light = rand(58,66); }
      else { hue = rand(300, 335); light = 74; }

      pushParticle({
        x,y,
        vx: Math.cos(ang)*sp,
        vy: Math.sin(ang)*sp,
        g: 0.040,
        drag: 0.988,
        a: 1,
        fade: rand(0.020, 0.038),
        r: rand(1.0, 1.8),
        hue, sat, light,
        sparkle: rand(0.04, 0.10),
        glow: rand(6, 12),
        style: "click"
      });
    }
  }

  window.addEventListener('contextmenu', (e) => e.preventDefault(), { passive:false });

  window.addEventListener('mousedown', (e) => {
    if(prefersReduced) return;
    if(e.clientY >= H * 0.70) return;

    const now = performance.now();
    if(now - lastClickFx < CLICK_COOLDOWN) return;
    lastClickFx = now;

    if(e.button === 0){
      spawnClickBurst(e.clientX, e.clientY, "gold");
    } else if(e.button === 2){
      e.preventDefault();
      spawnClickBurst(e.clientX, e.clientY, "fantasy");
    }
  }, { passive:false });

  function tick(){
    // 粒子上限（非常有效）
    if (particles.length > MAX_PARTICLES) particles.splice(0, particles.length - MAX_PARTICLES);

    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(7,10,20,0.22)";
    ctx.fillRect(0,0,W,H);

    // stars
    for(const s of stars){
      s.a += s.tw;
      if(s.a < 0.15 || s.a > 0.95) s.tw *= -1;
      s.x += s.drift;
      if(s.x < -10) s.x = W+10;
      if(s.x > W+10) s.x = -10;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }

    // rockets
    for(let i=rockets.length-1;i>=0;i--){
      const r = rockets[i];
      r.life += 1;

      r.windPhase += 0.035;
      r.vx += Math.sin(r.windPhase) * r.windAmp * 0.02;

      r.vx *= 0.996;
      r.vy *= 0.996;
      r.vy += 0.030;

      r.x += r.vx;
      r.y += r.vy;

      // 尾焰（也轻一点）
      const tailCount = 2;
      for(let k=0;k<tailCount;k++){
        const jitterX = rand(-0.8, 0.8);
        const jitterY = rand(-0.8, 0.8);

        let hue = r.hue;
        if(r.kind === "mix"){
          const pick = Math.random();
          hue = (pick<0.4) ? rand(305,335) : (pick<0.75) ? rand(38,62) : rand(195,220);
        }

        pushParticle({
          x: r.x + jitterX,
          y: r.y + jitterY,
          vx: rand(-0.22, 0.22) - r.vx*0.12,
          vy: rand(0.55, 1.15) - r.vy*0.10,
          g: 0.020,
          drag: 0.970,
          a: 0.85,
          fade: rand(0.040, 0.065),
          r: rand(1.1, 2.0),
          hue,
          sat: 90,
          light: rand(55, 72),
          sparkle: rand(0.04, 0.10),
          glow: rand(6, 12),
          style: "trail"
        });
      }

      // 火箭头（小亮点）
      ctx.beginPath();
      ctx.fillStyle = `hsla(${r.hue}, ${r.sat}%, ${r.light}%, 0.92)`;
      ctx.arc(r.x, r.y, 1.6, 0, Math.PI*2);
      ctx.fill();

      if(r.y <= r.targetY || r.vy > -0.6){
        explodeRocket(r);
        rockets.splice(i,1);
      }
      if(r.life > 260) rockets.splice(i,1);
    }

    // particles：加法叠加 + 限制 shadowBlur
    ctx.globalCompositeOperation = "lighter";
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.a -= p.fade;

      if(p.a <= 0){
        particles.splice(i,1);
        continue;
      }

      const flicker = (Math.random() < p.sparkle) ? rand(-0.18,0.10) : 0;
      const alpha = Math.max(0, Math.min(1, p.a + flicker));

      ctx.save();
      ctx.shadowBlur = Math.min(14, (p.glow || 10) + p.r * 4);
      ctx.shadowColor = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${Math.min(1, alpha)})`;
      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`;
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    drawVignette();
    requestAnimationFrame(tick);
  }
  tick();

  // Load stories
  (async () => {
    allItems = await loadStories();
    render(allItems, "tonight");
  })();

})();
</script>

<script>
/* ===== 桌宠：随机眨眼 + 拖拽 ===== */
(() => {
  const petDock = document.getElementById('petDock');
  const petSvg  = document.getElementById('petSvg');
  if(!petDock || !petSvg) return;

  // 眨眼：随机
  let blinking = false;
  function blinkOnce(){
    if(blinking) return;
    blinking = true;
    petSvg.classList.add('petBlink');
    setTimeout(() => {
      petSvg.classList.remove('petBlink');
      blinking = false;
    }, 140);
  }
  setInterval(() => { if(Math.random() < 0.35) blinkOnce(); }, 1400);

  // 拖拽（用 right/bottom）
  let dragging = false;
  let startX=0, startY=0, startRight=0, startBottom=0;
  const px = (v) => (parseFloat(String(v||"0").replace("px","")) || 0);

  function onDown(e){
    dragging = true;
    petDock.setPointerCapture?.(e.pointerId);
    const cs = getComputedStyle(petDock);
    startRight = px(cs.right);
    startBottom = px(cs.bottom);
    startX = e.clientX;
    startY = e.clientY;
    e.preventDefault();
  }
  function onMove(e){
    if(!dragging) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    petDock.style.right = Math.max(6, startRight - dx) + "px";
    petDock.style.bottom = Math.max(6, startBottom - dy) + "px";
  }
  function onUp(){ dragging = false; }

  petDock.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove, { passive:false });
  window.addEventListener('pointerup', onUp);
})();
</script>
