<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>给宝宝的睡前故事</title>
  <meta name="theme-color" content="#0b1020" />
  <style>
    :root{
      --bg:#070a14;
      --stroke:rgba(255,255,255,.10);
      --text:rgba(255,255,255,.92);
      --muted:rgba(255,255,255,.62);
      --shadow: 0 24px 70px rgba(0,0,0,.55);
      --radius: 22px;
      --radius2: 16px;
      --maxw: 980px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--sans);
      color:var(--text);
      background:
        radial-gradient(1200px 700px at 30% 15%, rgba(125,140,255,.20), transparent 60%),
        radial-gradient(900px 600px at 85% 20%, rgba(178,140,255,.14), transparent 60%),
        radial-gradient(1000px 800px at 50% 110%, rgba(0,0,0,.80), transparent 55%),
        var(--bg);
      overflow-x:hidden;
    }

    /* Canvas behind everything */
    #night-canvas{position:fixed; inset:0; z-index:0; pointer-events:none;}

    .wrap{
      position:relative;
      z-index:1;
      width:min(var(--maxw), calc(100% - 32px));
      margin: 34px auto 60px;
    }

    .hero{
      display:flex;
      gap:18px;
      align-items:center;
      padding: 18px 18px 14px;
      border-radius: calc(var(--radius) + 6px);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .moon{
      width:64px;height:64px;border-radius:18px;
      display:grid;place-items:center;
      background: linear-gradient(180deg, rgba(124,134,255,.22), rgba(124,134,255,.08));
      border:1px solid rgba(255,255,255,.10);
      box-shadow: 0 16px 40px rgba(0,0,0,.35);
      flex:0 0 auto;
      font-size:30px;
    }
    .title h1{
      margin:0;
      font-size:42px;
      letter-spacing:.5px;
      line-height:1.05;
    }
    .title p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:18px;
    }
    .chip{
      margin-left:auto;
      padding: 10px 14px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.12);
      background: rgba(20,26,50,.35);
      color:var(--muted);
      font-size:14px;
      max-width: 320px;
      text-overflow: ellipsis;
      overflow:hidden;
      white-space:nowrap;
    }

    .status{
      margin: 18px 0 0;
      padding: 14px 16px;
      border-radius: var(--radius2);
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.22);
      color: var(--muted);
      backdrop-filter: blur(10px);
      display:none;
    }
    .status.show{display:block}
    .status b{color:var(--text)}

    .toolbar{
      margin: 18px 0 16px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .btn{
      border:1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color:var(--text);
      padding: 10px 14px;
      border-radius: 999px;
      cursor:pointer;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      user-select:none;
    }
    .btn:hover{transform: translateY(-1px); background: rgba(255,255,255,.06)}
    .btn.primary{background: rgba(124,134,255,.20); border-color: rgba(124,134,255,.35)}

    .list{
      display:flex;
      flex-direction:column;
      gap:14px;
      margin-top: 10px;
    }

    .card{
      padding: 16px 16px 14px;
      border-radius: var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 18px 55px rgba(0,0,0,.40);
      backdrop-filter: blur(12px);
    }

    .cardHeader{
      display:flex;
      align-items:flex-start;
      gap:12px;
    }
    .tagIcon{
      width:34px;height:34px;border-radius:12px;
      display:grid;place-items:center;
      background: rgba(124,134,255,.15);
      border:1px solid rgba(124,134,255,.25);
      flex:0 0 auto;
      font-size:18px;
      margin-top:2px;
    }
    .meta{
      flex:1 1 auto;
      min-width: 0;
    }
    .meta h3{
      margin:0;
      font-size:22px;
      line-height:1.1;
    }
    .meta .sub{
      margin-top:8px;
      color: var(--muted);
      font-size:14px;
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .pill{
      padding: 6px 10px;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(0,0,0,.18);
      color: var(--muted);
      font-size: 12px;
    }
    .actions{
      display:flex;
      gap:10px;
      align-items:center;
      flex:0 0 auto;
    }

    audio{
      width:100%;
      margin-top: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.92);
    }

    /* ===== 右下角天空龙面板（约 8cm x 8cm） ===== */
    .dragonDock{
      position: fixed;
      right: 14px;
      bottom: 14px;
      width: 8cm;
      height: 8cm;
      max-width: 320px;
      max-height: 320px;
      min-width: 220px;
      min-height: 220px;
      z-index: 2;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      box-shadow: 0 18px 55px rgba(0,0,0,.35);
      backdrop-filter: blur(12px);
      overflow: hidden;
      pointer-events: none; /* 不挡住页面交互 */
    }
    .dragonHint{
      position:absolute;
      left:12px; top:10px;
      font-size:12px;
      color:rgba(255,255,255,.55);
      letter-spacing:.2px;
      user-select:none;
    }
    .dragonSvg{
      width:100%;
      height:100%;
      display:block;
    }

    /* 动作：呼吸 + 翅膀 + 尾巴 */
    @keyframes dragonBreath {
      0%,100%{ transform: translateY(0) scale(1); }
      50%{ transform: translateY(2px) scale(1.01); }
    }
    @keyframes wingFlapL {
      0%,100%{ transform: rotate(-6deg) translate(0,0); }
      50%{ transform: rotate(10deg) translate(0,-2px); }
    }
    @keyframes wingFlapR {
      0%,100%{ transform: rotate(6deg) translate(0,0); }
      50%{ transform: rotate(-10deg) translate(0,-2px); }
    }
    @keyframes tailSway {
      0%,100%{ transform: rotate(-6deg); }
      50%{ transform: rotate(10deg); }
    }
    @keyframes earWiggle {
      0%,100%{ transform: rotate(0deg); }
      50%{ transform: rotate(6deg); }
    }
    .dragonBodyAnim{ transform-origin: 55% 60%; animation: dragonBreath 3.4s ease-in-out infinite; }
    .wingL{ transform-origin: 36% 56%; animation: wingFlapL 1.25s ease-in-out infinite; }
    .wingR{ transform-origin: 70% 56%; animation: wingFlapR 1.25s ease-in-out infinite; }
    .tail{ transform-origin: 78% 72%; animation: tailSway 2.0s ease-in-out infinite; }
    .ear{ transform-origin: 46% 35%; animation: earWiggle 2.8s ease-in-out infinite; }

    @media (max-width: 720px){
      .title h1{font-size: 34px;}
      .chip{display:none}
      .meta h3{font-size: 19px;}
      .dragonDock{ right: 10px; bottom: 10px; width: 6.6cm; height: 6.6cm; min-width: 190px; min-height: 190px; }
    }
  </style>
</head>

<body>
  <canvas id="night-canvas" aria-hidden="true"></canvas>

  <div class="wrap">
    <div class="hero">
      <div class="moon">🌙</div>
      <div class="title">
        <h1>给宝宝的睡前故事</h1>
        <p id="subtitle">我不在你身边，但我在你耳边。</p>
      </div>
      <div class="chip" id="quoteChip">今晚小句：今天也很棒。</div>
    </div>

    <div class="status" id="statusBox"></div>

    <div class="toolbar">
      <button class="btn primary" id="btnTonight">只看今晚</button>
      <button class="btn" id="btnAll">查看往期</button>
    </div>

    <div class="list" id="list"></div>
  </div>

  <!-- 右下角天空龙 -->
  <div class="dragonDock" aria-hidden="true">
    <div class="dragonHint">小龙在这陪你</div>
    <svg class="dragonSvg" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bgGlow" cx="40%" cy="30%" r="70%">
          <stop offset="0%" stop-color="rgba(160,180,255,0.18)"/>
          <stop offset="65%" stop-color="rgba(160,180,255,0.05)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </radialGradient>

        <linearGradient id="plushA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#bcd7ff"/>
          <stop offset="55%" stop-color="#8fb5ff"/>
          <stop offset="100%" stop-color="#6d8dff"/>
        </linearGradient>

        <linearGradient id="plushB" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#d6e6ff"/>
          <stop offset="70%" stop-color="#a9c3ff"/>
          <stop offset="100%" stop-color="#7ea1ff"/>
        </linearGradient>

        <linearGradient id="wingGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#ffd6f2"/>
          <stop offset="55%" stop-color="#d9c6ff"/>
          <stop offset="100%" stop-color="#a9c3ff"/>
        </linearGradient>

        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="rgba(0,0,0,0.35)"/>
        </filter>

        <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge>
            <feMergeNode in="b"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- 背景柔光 -->
      <rect x="0" y="0" width="320" height="320" fill="url(#bgGlow)"/>

      <g class="dragonBodyAnim" filter="url(#softShadow)">
        <!-- 尾巴（在后面） -->
        <g class="tail">
          <path d="M215 215
                   C255 225, 285 245, 270 268
                   C258 286, 230 284, 220 270
                   C210 255, 225 245, 242 248
                   C230 238, 212 234, 200 240
                   C186 247, 182 264, 190 278"
                fill="none" stroke="url(#plushB)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M260 266
                   C268 270, 275 276, 270 284
                   C266 291, 255 292, 248 284"
                fill="none" stroke="#ffd6f2" stroke-width="8" stroke-linecap="round"/>
        </g>

        <!-- 翅膀（后） -->
        <g class="wingL" opacity="0.95">
          <path d="M118 168
                   C78 150, 58 120, 72 96
                   C90 66, 138 78, 150 108
                   C156 122, 147 142, 132 160"
                fill="url(#wingGrad)" filter="url(#softGlow)"/>
          <path d="M120 168
                   C92 154, 78 136, 88 120"
                fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round"/>
        </g>

        <g class="wingR" opacity="0.92">
          <path d="M200 168
                   C242 150, 262 120, 248 96
                   C230 66, 182 78, 170 108
                   C164 122, 173 142, 188 160"
                fill="url(#wingGrad)" filter="url(#softGlow)"/>
          <path d="M200 168
                   C228 154, 242 136, 232 120"
                fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- 身体 -->
        <ellipse cx="160" cy="205" rx="92" ry="70" fill="url(#plushA)"/>
        <ellipse cx="160" cy="212" rx="74" ry="54" fill="rgba(255,255,255,0.10)"/>

        <!-- 头 -->
        <g>
          <ellipse cx="160" cy="138" rx="78" ry="62" fill="url(#plushB)"/>
          <!-- 小耳朵/角 -->
          <g class="ear">
            <path d="M128 90 C118 70, 130 58, 148 74 C140 82, 136 88, 128 90 Z" fill="#a9c3ff"/>
            <path d="M192 90 C202 70, 190 58, 172 74 C180 82, 184 88, 192 90 Z" fill="#a9c3ff"/>
          </g>

          <!-- 脸颊 -->
          <ellipse cx="122" cy="152" rx="20" ry="16" fill="rgba(255,214,242,0.22)"/>
          <ellipse cx="198" cy="152" rx="20" ry="16" fill="rgba(255,214,242,0.22)"/>

          <!-- 眼睛 -->
          <circle cx="132" cy="132" r="10" fill="rgba(20,26,50,0.75)"/>
          <circle cx="188" cy="132" r="10" fill="rgba(20,26,50,0.75)"/>
          <circle cx="129" cy="129" r="3" fill="rgba(255,255,255,0.85)"/>
          <circle cx="185" cy="129" r="3" fill="rgba(255,255,255,0.85)"/>

          <!-- 鼻口 -->
          <path d="M150 158
                   C160 166, 170 166, 180 158"
                fill="none" stroke="rgba(20,26,50,0.55)" stroke-width="5" stroke-linecap="round"/>
          <path d="M158 160 C160 162, 162 162, 164 160"
                fill="none" stroke="rgba(20,26,50,0.45)" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- 小爪爪 -->
        <g opacity="0.95">
          <ellipse cx="118" cy="246" rx="18" ry="14" fill="rgba(255,255,255,0.12)"/>
          <ellipse cx="202" cy="246" rx="18" ry="14" fill="rgba(255,255,255,0.12)"/>
          <path d="M105 245 C112 252, 123 252, 130 245" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="3" stroke-linecap="round"/>
          <path d="M190 245 C197 252, 208 252, 215 245" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- 小星星点缀 -->
        <g opacity="0.65">
          <circle cx="72" cy="76" r="2.6" fill="rgba(255,255,255,0.65)"/>
          <circle cx="258" cy="74" r="2.2" fill="rgba(255,255,255,0.55)"/>
          <circle cx="286" cy="118" r="1.8" fill="rgba(255,255,255,0.50)"/>
          <circle cx="54" cy="130" r="1.6" fill="rgba(255,255,255,0.45)"/>
        </g>
      </g>
    </svg>
  </div>

<script>
(() => {
  const STATUS = document.getElementById('statusBox');
  const LIST = document.getElementById('list');

  const QUOTES = [
    "把烦恼交给夜色。",
    "闭上眼，我在。",
    "今天也很棒。",
    "来，把今天交给我。",
    "呼吸慢一点，世界就慢下来。",
    "你很努力了，真的。"
  ];

  function showStatus(html, isError=false){
    STATUS.classList.add('show');
    STATUS.innerHTML = (isError ? "<b>加载失败：</b> " : "") + html;
  }
  function hideStatus(){
    STATUS.classList.remove('show');
    STATUS.innerHTML = "";
  }

  // Random quote
  const quote = QUOTES[Math.floor(Math.random()*QUOTES.length)];
  document.getElementById('quoteChip').textContent = "今晚小句：" + quote;

  // Local storage for "heard"
  const HEARD_KEY = "goodnight_heard_v1";
  const heard = new Set(JSON.parse(localStorage.getItem(HEARD_KEY) || "[]"));

  function markHeard(id, val){
    if (val) heard.add(id);
    else heard.delete(id);
    localStorage.setItem(HEARD_KEY, JSON.stringify([...heard]));
  }

  function fmtDate(d){ return d; }
  function safeText(s){ return (s ?? "").toString(); }

  // ---------- 音频 URL 兜底：兼容 GitHub Pages / 中文空格 / # 截断 / 自动 MIME ----------
  function normalizeFilePath(file){
    let f = (file ?? "").toString().trim();
    if (f.startsWith("/")) f = f.slice(1); // 项目页避免 404
    return f;
  }
  function guessMimeType(file){
    const ext = (file.split(".").pop() || "").toLowerCase();
    const map = {
      mp3:"audio/mpeg", m4a:"audio/mp4", aac:"audio/aac",
      wav:"audio/wav", ogg:"audio/ogg", webm:"audio/webm"
    };
    return map[ext] || "";
  }
  function toSafeUrl(file){
    const f = normalizeFilePath(file);
    const encoded = encodeURI(f).replace(/#/g, "%23").replace(/\?/g, "%3F");
    return new URL(encoded, window.location.href).href;
  }

  function escapeHtml(str){
    return str.replace(/[&<>"']/g, (m) => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function render(items, mode="tonight"){
    LIST.innerHTML = "";

    items.sort((a,b) => {
      const da = (a.date || a.id || "").toString();
      const db = (b.date || b.id || "").toString();
      if (db !== da) return db.localeCompare(da);
      return (b.id || "").toString().localeCompare((a.id || "").toString());
    });

    const todayStr = new Date().toISOString().slice(0,10);
    let filtered = items;

    if (mode === "tonight") {
      const maxDate = items.length ? (items[0].date || items[0].id) : todayStr;
      filtered = items.filter(x => (x.date || x.id) === maxDate);
    }

    if (!filtered.length){
      showStatus("没有找到故事条目。请检查 stories.json。", true);
      return;
    } else hideStatus();

    for (const it of filtered){
      const id = safeText(it.id || it.date || it.title || Math.random().toString(16).slice(2));
      const date = safeText(it.date || it.id || "");
      const title = safeText(it.title || "未命名故事");
      const note = safeText(it.note || "");
      const file = safeText(it.file || "");

      const isHeard = heard.has(id);
      const srcUrl = toSafeUrl(file);
      const mime = guessMimeType(file);

      const card = document.createElement('div');
      card.className = "card";
      card.innerHTML = `
        <div class="cardHeader">
          <div class="tagIcon">🌙</div>
          <div class="meta">
            <h3>${mode==="tonight" ? "今晚故事 · " : "往期故事 · "}${escapeHtml(title)}</h3>
            <div class="sub">
              <span class="pill">🗓 ${escapeHtml(fmtDate(date))}</span>
              <span class="pill">${isHeard ? "已听" : "未听"}</span>
              ${note ? `<span class="pill">${escapeHtml(note)}</span>` : ""}
            </div>
          </div>
          <div class="actions">
            <button class="btn btnMark">${isHeard ? "标记未听" : "标记已听"}</button>
          </div>
        </div>
        <audio controls preload="metadata">
          <source src="${srcUrl}" ${mime ? `type="${mime}"` : ""}>
          你的浏览器不支持音频播放。
        </audio>
      `;

      card.querySelector('.btnMark').addEventListener('click', () => {
        const now = !heard.has(id);
        markHeard(id, now);
        render(items, mode);
      });

      const audio = card.querySelector('audio');
      audio.addEventListener('ended', () => {
        markHeard(id, true);
        render(items, mode);
      });

      audio.addEventListener('error', () => {
        showStatus(
          `音频加载失败：<code>${escapeHtml(file)}</code>。<br/>` +
          `请确认：文件已上传到仓库同级目录（或路径写对），且文件名与 stories.json 完全一致（大小写/空格/# 也算）。`,
          true
        );
      });

      LIST.appendChild(card);
    }
  }

  async function loadStories(){
    try{
      const res = await fetch("stories.json?v=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("stories.json 读取失败：" + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("stories.json 格式不对：需要是数组 []");
      return data;
    } catch (e){
      showStatus(`${escapeHtml(e.message)}<br/>你可以在地址栏打开 <code>/stories.json</code> 看是否能访问。`, true);
      return [];
    }
  }

  // UI buttons
  let allItems = [];
  let mode = "tonight";

  document.getElementById('btnTonight').addEventListener('click', () => {
    mode = "tonight";
    render(allItems, mode);
  });
  document.getElementById('btnAll').addEventListener('click', () => {
    mode = "all";
    render(allItems, mode);
  });

  // =========================
  // 星空 + 升空烟花（自动）+ 手动点爆
  // =========================
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById('night-canvas');
  const ctx = canvas.getContext('2d', { alpha: true });

  let W=0, H=0, DPR=1;

  function resizeCanvas(){
    DPR = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
    W = Math.floor(window.innerWidth);
    H = Math.floor(window.innerHeight);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resizeCanvas, { passive:true });
  resizeCanvas();

  function rand(min,max){ return Math.random()*(max-min)+min; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }

  // Stars
  const stars = [];
  const STAR_COUNT = prefersReduced ? 60 : 160;

  function initStars(){
    stars.length = 0;
    for(let i=0;i<STAR_COUNT;i++){
      stars.push({
        x: Math.random()*W,
        y: Math.random()*H,
        r: rand(0.6,1.6),
        a: rand(0.25,0.9),
        tw: rand(0.004,0.014)*(Math.random()<0.5?1:-1),
        drift: rand(-0.015,0.015)
      });
    }
  }
  initStars();

  // Particles / Rockets
  const particles = [];
  const rockets = [];

  function pushParticle(p){ particles.push(p); }

  function drawVignette(){
    const g = ctx.createRadialGradient(W*0.5, H*0.35, 0, W*0.5, H*0.5, Math.max(W,H));
    g.addColorStop(0, 'rgba(10, 18, 40, 0.18)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0.58)');
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = g;
    ctx.fillRect(0,0,W,H);
  }

  // ----------- 爆炸：普通（含 mix/blue/gold/fantasy）-----------
  function spawnExplosion(x,y, style="fantasy"){
    const count = (style==="gold") ? Math.floor(rand(60,85))
               : (style==="mix")  ? Math.floor(rand(70,95))
               : (style==="blue") ? Math.floor(rand(55,80))
               : Math.floor(rand(45,70));

    for(let i=0;i<count;i++){
      const angle = (Math.PI*2)*(i/count) + rand(-0.06,0.06);
      const speed = (style==="gold") ? rand(1.6,4.4)
                  : (style==="mix")  ? rand(1.5,4.6)
                  : (style==="blue") ? rand(1.4,4.2)
                  : rand(1.2,3.8);

      let hue, sat, light;
      if(style==="fantasy"){
        hue = (Math.random()<0.15) ? rand(255,270) : rand(300,335); // 粉紫
        sat = 92; light = 74;
      } else if(style==="gold"){
        hue = rand(38,62); sat = 96; light = rand(58,66);
      } else if(style==="blue"){
        hue = rand(195,220); sat = 92; light = rand(62,74);
      } else {
        const pick = Math.random();
        if(pick < 0.40){ hue = rand(305,335); sat = 92; light = 74; } // 粉
        else if(pick < 0.75){ hue = rand(38,62); sat = 96; light = rand(58,66); } // 金
        else { hue = rand(195,220); sat = 92; light = rand(62,74); } // 蓝
      }

      pushParticle({
        x,y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        g: (style==="gold") ? 0.055 : 0.045,
        drag: (style==="gold") ? 0.982 : 0.985,
        a: 1,
        fade: (style==="gold") ? rand(0.010,0.020) : rand(0.008,0.018),
        r: (style==="gold") ? rand(1.4,2.3) : rand(1.2,2.1),
        hue, sat, light,
        sparkle: (style==="gold") ? rand(0.12,0.30) : rand(0.06,0.20),
        glow: rand(10, 22),
        style
      });
    }
  }

  // ----------- 玫瑰烟花：更久（更慢 fade）-----------
  function spawnRoseFirework(x,y){
    const petals = 5;
    const count = Math.floor(rand(150, 210));
    const A = rand(22, 56);
    const baseSpeed = rand(0.85, 1.35);

    // 花心轻闪
    for(let k=0;k<22;k++){
      const ang = rand(0, Math.PI*2);
      const sp = rand(0.3, 1.25);
      pushParticle({
        x,y,
        vx: Math.cos(ang)*sp,
        vy: Math.sin(ang)*sp,
        g: 0.015,
        drag: 0.990,
        a: 1,
        fade: rand(0.0038, 0.0072),
        r: rand(1.2, 2.6),
        hue: rand(335, 350),
        sat: 92,
        light: rand(72, 84),
        sparkle: rand(0.05, 0.12),
        glow: rand(14, 26),
        style:"rose_core"
      });
    }

    for(let i=0;i<count;i++){
      const t = (Math.PI*2) * (i / count);
      const rCurve = A * Math.sin(petals * t);

      const dx = Math.cos(t) * rCurve;
      const dy = Math.sin(t) * rCurve;

      const angle = Math.atan2(dy, dx) + rand(-0.12, 0.12);
      const speed = baseSpeed * (1.0 + Math.abs(rCurve)/A) * rand(0.9, 1.25);

      const pick = Math.random();
      const hue = (pick < 0.58) ? rand(332, 350) : rand(0, 12); // 粉/红
      const sat = 92;
      const light = (pick < 0.58) ? rand(70, 82) : rand(62, 76);

      pushParticle({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        g: 0.024,
        drag: 0.991,
        a: 1,
        fade: rand(0.0032, 0.0068), // 更慢=更久
        r: rand(1.1, 2.2),
        hue, sat, light,
        sparkle: rand(0.05, 0.18),
        glow: rand(14, 28),
        style:"rose"
      });
    }
  }

  // ----------- 爱心烟花（粉色）-----------
  function spawnHeartFirework(x,y){
    const count = Math.floor(rand(160, 230));
    const scale = rand(1.25, 1.85);
    const baseSpeed = rand(0.85, 1.25);

    for(let i=0;i<count;i++){
      const t = (Math.PI*2) * (i / count);
      const sx = 16 * Math.pow(Math.sin(t), 3);
      const sy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

      const px = sx * scale;
      const py = -sy * scale;

      const ang = Math.atan2(py, px) + rand(-0.10, 0.10);
      const sp = baseSpeed * (0.8 + rand(0, 0.7));
      const w = clamp(1 - Math.abs(Math.sin(t))*0.25, 0.6, 1.0);
      const speed = sp * w;

      pushParticle({
        x: x + px,
        y: y + py,
        vx: Math.cos(ang)*speed,
        vy: Math.sin(ang)*speed,
        g: 0.020,
        drag: 0.992,
        a: 1,
        fade: rand(0.0042, 0.0092),
        r: rand(1.1, 2.1),
        hue: rand(330, 350),
        sat: 92,
        light: rand(70, 84),
        sparkle: rand(0.06, 0.20),
        glow: rand(14, 26),
        style:"heart"
      });
    }

    for(let k=0;k<18;k++){
      const ang = rand(0, Math.PI*2);
      const sp = rand(0.2, 1.0);
      pushParticle({
        x,y,
        vx: Math.cos(ang)*sp,
        vy: Math.sin(ang)*sp,
        g: 0.012,
        drag: 0.993,
        a: 1,
        fade: rand(0.006, 0.012),
        r: rand(1.0, 2.3),
        hue: rand(330, 350),
        sat: 92,
        light: rand(74, 88),
        sparkle: rand(0.05, 0.14),
        glow: rand(12, 22),
        style:"heart_core"
      });
    }
  }

  // ----------- 升空火箭 -----------
  function launchRocket(kind){
    // kind: "mix" | "rose" | "heart"
    const x0 = rand(W*0.18, W*0.82);
    const y0 = H + rand(20, 90);
    const targetY = rand(H*0.12, H*0.42);

    const upSpeed = rand(7.2, 10.2);
    const drift0 = rand(-0.35, 0.35);

    const hue = (kind==="mix") ? rand(38, 62)
              : (kind==="rose"||kind==="heart") ? rand(332, 350)
              : rand(38, 62);

    rockets.push({
      x: x0,
      y: y0,
      vx: drift0,
      vy: -upSpeed,
      targetY,
      kind,
      hue,
      sat: 92,
      light: 72,
      life: 0,
      windPhase: rand(0, Math.PI*2),
      windAmp: rand(0.18, 0.55)
    });
  }

  function explodeRocket(r){
    if(r.kind === "mix") spawnExplosion(r.x, r.y, "mix");
    else if(r.kind === "rose") spawnRoseFirework(r.x, r.y);
    else if(r.kind === "heart") spawnHeartFirework(r.x, r.y);
  }

  // ----------- 自动节奏（错开）-----------
  function scheduleAuto(){
    if(prefersReduced) return;

    // 普通：10 秒 ~ 2 个
    const normalBase = 10000;
    const normalStart = 1200 + rand(0, 900);

    // 玫瑰：10 秒 ~ 2 个（错开）
    const roseBase = 10000;
    const roseStart = 5200 + rand(0, 1100);

    // 爱心：5 秒 ~ 2 个
    const heartBase = 5000;
    const heartStart = 2600 + rand(0, 700);

    function normalRound(){
      launchRocket("mix");
      setTimeout(() => launchRocket("mix"), 1300 + rand(0, 1500));
      setTimeout(normalRound, normalBase + rand(-900, 1200));
    }
    function roseRound(){
      launchRocket("rose");
      setTimeout(() => launchRocket("rose"), 1500 + rand(0, 1600));
      setTimeout(roseRound, roseBase + rand(-900, 1200));
    }
    function heartRound(){
      launchRocket("heart");
      setTimeout(() => launchRocket("heart"), 700 + rand(0, 900));
      setTimeout(heartRound, heartBase + rand(-450, 650));
    }

    setTimeout(normalRound, normalStart);
    setTimeout(roseRound, roseStart);
    setTimeout(heartRound, heartStart);
  }
  scheduleAuto();

  // ----------- 手动交互：左键金 / 右键粉紫（直接点爆）-----------
  window.addEventListener('contextmenu', (e) => e.preventDefault(), { passive:false });

  window.addEventListener('mousedown', (e) => {
    if(prefersReduced) return;
    // 只在天空区域触发，避免点到播放器
    if(e.clientY >= H * 0.70) return;

    if(e.button === 0){
      spawnExplosion(e.clientX, e.clientY, "gold");
    } else if(e.button === 2){
      e.preventDefault();
      spawnExplosion(e.clientX, e.clientY, "fantasy");
    }
  }, { passive:false });

  // ----------- 主循环（更高级渲染：残影 + 加法叠加 + 柔光）-----------
  function tick(){
    // 残影清屏（比 clearRect 更高级）
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = "rgba(7,10,20,0.22)"; // 越小拖影越明显
    ctx.fillRect(0,0,W,H);

    // stars
    for(const s of stars){
      s.a += s.tw;
      if(s.a < 0.15 || s.a > 0.95) s.tw *= -1;
      s.x += s.drift;
      if(s.x < -10) s.x = W+10;
      if(s.x > W+10) s.x = -10;
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${s.a})`;
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fill();
    }

    // rockets (升空 + 尾焰)
    for(let i=rockets.length-1;i>=0;i--){
      const r = rockets[i];
      r.life += 1;

      // 风场摆动（轨迹更真实）
      r.windPhase += 0.035;
      r.vx += Math.sin(r.windPhase) * r.windAmp * 0.02;

      // 阻力 + 重力（上升变慢）
      r.vx *= 0.996;
      r.vy *= 0.996;
      r.vy += 0.030;

      r.x += r.vx;
      r.y += r.vy;

      // 尾焰拖尾（粒子）
      const tailCount = 3;
      for(let k=0;k<tailCount;k++){
        const jitterX = rand(-0.8, 0.8);
        const jitterY = rand(-0.8, 0.8);

        let hue = r.hue;
        if(r.kind === "mix"){
          const pick = Math.random();
          hue = (pick<0.4) ? rand(305,335) : (pick<0.75) ? rand(38,62) : rand(195,220);
        }

        pushParticle({
          x: r.x + jitterX,
          y: r.y + jitterY,
          vx: rand(-0.25, 0.25) - r.vx*0.15,
          vy: rand(0.6, 1.4) - r.vy*0.10,
          g: 0.020,
          drag: 0.965,
          a: 0.9,
          fade: rand(0.035, 0.060),
          r: rand(1.2, 2.2),
          hue,
          sat: 90,
          light: rand(55, 72),
          sparkle: rand(0.05, 0.12),
          glow: rand(8, 16),
          style: "trail"
        });
      }

      // 火箭头（小亮点）
      ctx.beginPath();
      ctx.fillStyle = `hsla(${r.hue}, ${r.sat}%, ${r.light}%, 0.95)`;
      ctx.arc(r.x, r.y, 1.8, 0, Math.PI*2);
      ctx.fill();

      // 到高度 or 上升快停时爆炸
      if(r.y <= r.targetY || r.vy > -0.6){
        explodeRocket(r);
        rockets.splice(i,1);
      }

      if(r.life > 260) rockets.splice(i,1);
    }

    // particles：加法叠加 + 柔光
    ctx.globalCompositeOperation = "lighter";
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.vy += p.g;
      p.x += p.vx;
      p.y += p.vy;
      p.a -= p.fade;

      if(p.a <= 0){
        particles.splice(i,1);
        continue;
      }

      const flicker = (Math.random() < p.sparkle) ? rand(-0.18,0.10) : 0;
      const alpha = Math.max(0, Math.min(1, p.a + flicker));

      ctx.save();
      ctx.shadowBlur = (p.glow || 12) + p.r * 6;
      ctx.shadowColor = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${Math.min(1, alpha)})`;
      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, ${p.light}%, ${alpha})`;
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    drawVignette();
    requestAnimationFrame(tick);
  }
  tick();

  // Load stories
  (async () => {
    allItems = await loadStories();
    render(allItems, "tonight");
  })();

})();
</script>
