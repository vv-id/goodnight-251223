name: Weather Push

on:
  schedule:
    - cron: "0 17 * * *"  # 每天 UTC 17:00 固定触发
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run push script
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          CITY: ${{ vars.CITY }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          LOCAL_TZ: ${{ vars.LOCAL_TZ }}
          PUSH_HOUR_LOCAL: ${{ vars.PUSH_HOUR_LOCAL }}
          MOOD: ${{ vars.MOOD }}
          EXERCISE_TIP: ${{ vars.EXERCISE_TIP }}
        run: python scripts/push_goodnight.py
